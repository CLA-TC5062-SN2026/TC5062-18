      operationId: listarOfertasProducto
      summary: Consultar las ofertas de proveedor del producto
      description: |
        Roles Dueño. Incluye costos. Un Empleado que llama este endpoint recibe
        403 y no obtiene ofertas ni costos.
      x-acceptance-criteria:
        - RF-01-AC-3
