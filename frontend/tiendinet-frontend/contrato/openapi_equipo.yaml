      properties:
        productoId:
          type: string
          format: uuid
        nombre:
          type: string
        unidades:
          type: integer
          description: No incluye unidades de ventas canceladas ni merma.
    ReporteRotacion:
      type: object
      additionalProperties: false
      required: [desde, hasta, productos]
      properties:
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        productos:
          type: array
