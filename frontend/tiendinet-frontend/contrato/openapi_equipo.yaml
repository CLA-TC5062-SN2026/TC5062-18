    ModalidadPedido:
      type: string
      enum: [RECOGER_TIENDA, ENVIO_DOMICILIO]
    EstadoPedido:
      type: string
      enum: [PENDIENTE_PAGO, PAGADO, EXPIRADO, EN_PREPARACION, ESPERANDO_RESPUESTA_CLIENTE, LISTO_PARA_RECOGER, LISTO_PARA_ENVIAR, EN_CAMINO, ENTREGADO, NO_RECOGIDO, CANCELADO]
    PedidoCrear:
      type: object
      additionalProperties: false
      required: [modalidad]
      properties:
        modalidad:
          $ref: '#/components/schemas/ModalidadPedido'
        direccion:
          nullable: true
          description: Obligatoria en envío a domicilio. En recolección no se usa.
          allOf:
            - $ref: '#/components/schemas/Direccion'
        renglones:
          type: array
          description: |
            Si se envía, sustituye al carrito para esta confirmación. Sirve para
            el llamado directo que intenta incluir un producto restringido.
          items:
            $ref: '#/components/schemas/RenglonCarritoCrear'
    RenglonPedido:
      type: object
      additionalProperties: false
      required: [id, productoId, nombre, cantidad, precioUnitario, cantidadApartada, cantidadFaltante, subtotal]
      properties:
        id:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        nombre:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          $ref: '#/components/schemas/Dinero'
        cantidadApartada:
          type: integer
        cantidadFaltante:
          type: integer
        subtotal:
          $ref: '#/components/schemas/Dinero'
        productoSustitutoId:
          type: string
          format: uuid
          nullable: true
    HistorialEstadoPedido:
      type: object
      additionalProperties: false
      required: [estado, fechaHora]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        usuarioId:
          type: string
          format: uuid
          nullable: true
        usuarioNombre:
          type: string
          nullable: true
        fechaHora:
          type: string
          format: date-time
        comentario:
          type: string
          nullable: true
    ResolucionRegistrada:
      type: object
      additionalProperties: false
      required: [tipo, usuarioId, fechaHora]
      properties:
        tipo:
          type: string
          enum: [TOTAL, PARCIAL, NINGUNO]
        monto:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'
        usuarioId:
          type: string
          format: uuid
        fechaHora:
          type: string
          format: date-time
    Pedido:
      type: object
      additionalProperties: false
      required: [id, folio, subtotal, costoEnvio, total, modalidad, estado, renglones]
      properties:
        id:
          type: string
          format: uuid
        folio:
          type: string
        clienteId:
          type: string
          format: uuid
        nombreCliente:
          type: string
        telefonoCliente:
          type: string
          nullable: true
          description: |
            El Empleado solo lo recibe en EN_PREPARACION, LISTO_PARA_RECOGER,
            LISTO_PARA_ENVIAR o EN_CAMINO. En otro estado es null.
        subtotal:
          $ref: '#/components/schemas/Dinero'
        modalidad:
          $ref: '#/components/schemas/ModalidadPedido'
        direccion:
          type: string
          nullable: true
        codigoPostal:
          type: string
          nullable: true
        costoEnvio:
          allOf:
            - $ref: '#/components/schemas/Dinero'
          description: Se congela al crear el pedido. Un cambio posterior de la tarifa no lo altera.
        total:
          $ref: '#/components/schemas/Dinero'
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        empleadoAsignadoId:
          type: string
          format: uuid
          nullable: true
        empleadoAsignadoNombre:
          type: string
          nullable: true
        fechaEntregaORecoleccion:
          type: string
          format: date
          nullable: true
          description: La fecha definitiva se fija al confirmar el pago.
        leyendaEntrega:
          type: string
          nullable: true
          example: 'Entrega: mañana de 9:00 a 20:00'
        expiraPagoEn:
          type: string
          format: date-time
          nullable: true
        renglones:
          type: array
          items:
            $ref: '#/components/schemas/RenglonPedido'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HistorialEstadoPedido'
        reembolsos:
          type: array
          items:
            $ref: '#/components/schemas/Reembolso'
        resolucionNoRecogido:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ResolucionRegistrada'
    ListaPedidos:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    PedidoResumen:
      type: object
      additionalProperties: false
      required: [id, folio, fecha, total, estado, modalidad]
      properties:
        id:
          type: string
          format: uuid
        folio:
          type: string
        fecha:
          type: string
          format: date-time
        total:
          $ref: '#/components/schemas/Dinero'
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        modalidad:
          $ref: '#/components/schemas/ModalidadPedido'
        fechaEntregaORecoleccion:
          type: string
          format: date
          nullable: true
    ListaMisPedidos:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          description: Del más reciente al más antiguo.
          items:
            $ref: '#/components/schemas/PedidoResumen'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    ListaHistorialPedido:
      type: object
      additionalProperties: false
      required: [pedidoId, historial]
      properties:
        pedidoId:
          type: string
          format: uuid
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HistorialEstadoPedido'
    SesionPago:
      type: object
      additionalProperties: false
      required: [metodos, urlPago]
      properties:
        metodos:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [PAGO_EN_LINEA]
          description: Solo pago anticipado en línea. No hay efectivo al recoger.
        urlPago:
          type: string
          format: uri
    AsignarPedido:
      type: object
      additionalProperties: false
      required: [empleadoId]
      properties:
        empleadoId:
          type: string
          format: uuid
    TransicionPedido:
      type: object
      additionalProperties: false
      required: [estadoDestino]
      properties:
        estadoDestino:
          type: string
          enum: [EN_PREPARACION, LISTO_PARA_RECOGER, LISTO_PARA_ENVIAR, EN_CAMINO, ENTREGADO]
        empleadoId:
          type: string
          format: uuid
          nullable: true
          description: Permite asignar y pasar a EN_PREPARACION en la misma llamada.
        comentario:
          type: string
          nullable: true
    CancelarPedido:
      type: object
      additionalProperties: false
      required: [motivo]
