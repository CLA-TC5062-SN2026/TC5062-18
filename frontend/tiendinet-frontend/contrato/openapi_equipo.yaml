        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /recepciones:
    get:
      tags: [Inventario]
      operationId: listarRecepciones
      summary: Listar recepciones de mercancía
      description: Roles Dueño y Empleado. El costo unitario solo se incluye para el Dueño.
      x-acceptance-criteria:
        - RF-05-AC-1
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - name: productoId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recepciones, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaRecepciones'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Inventario]
      operationId: registrarRecepcion
      summary: Registrar una recepción y crear su lote
      description: |
        Roles Dueño y Empleado. La cantidad es un entero positivo. Si el producto
        es perecedero, la fecha de caducidad es obligatoria; si falta, responde
        422 y no guarda la entrada. El costo unitario solo lo aplica el Dueño:
        si un Empleado lo envía, se ignora. Si el Dueño no lo envía, se toma el
        de la oferta vigente. Con el proveedor "Otro (ruta)" el lote queda sin
        oferta. La existencia física y la disponible aumentan en la misma
        transacción y queda el movimiento con usuario, fecha y hora. Si con esta
        entrada la disponible supera el punto de reorden, la alerta activa pasa
        a resuelta.
      x-acceptance-criteria:
        - RF-05-AC-1
        - RF-05-AC-2
        - RF-05-AC-3
        - RF-05-AC-4
        - RF-09-AC-5
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
