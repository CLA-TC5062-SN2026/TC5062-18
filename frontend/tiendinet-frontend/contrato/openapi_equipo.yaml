          schema:
            type: string
            format: date
      responses:
        '200':
          description: Efectivo esperado, tarjeta por separado y ventas que entrarán al corte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VistaPreviaCorte'
              example:
                fecha: '2026-10-02'
                efectivoEsperado: '1000.00'
                totalTarjeta: '500.00'
                ventasEnLineaExcluidas: true
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /cortes-caja:
    get:
      tags: [Cortes de caja]
      operationId: listarCortesCaja
      summary: Listar cortes de caja
      description: Roles Dueño y Empleado. Puede haber más de un corte en el mismo día.
      x-acceptance-criteria:
        - RF-20-AC-3
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - name: fecha
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cortes registrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCortes'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Cortes de caja]
      operationId: crearCorteCaja
      summary: Cerrar el corte de caja
      description: |
        Roles Dueño y Empleado. Guarda usuario, fecha, hora, efectivo esperado,
        efectivo contado y diferencia (contado − esperado), más el total con
        tarjeta por separado. Cubre las ventas en efectivo aún no incluidas en un
        corte; una venta diferida de un día ya cortado entra al siguiente. Esas
        ventas ya no se pueden cancelar. Las canceladas no suman al esperado y
        las ventas en línea no forman parte del corte.
      x-acceptance-criteria:
        - RF-20-AC-1
        - RF-20-AC-2
        - RF-20-AC-3
        - RF-18-AC-3
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorteCajaCrear'
            example:
              fecha: '2026-10-02'
              efectivoContado: '980.00'
      responses:
        '201':
          description: Corte cerrado. Sus ventas ya no se pueden cancelar.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorteCaja'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                fechaHora: '2026-10-03T02:10:00Z'
                efectivoEsperado: '1000.00'
                efectivoContado: '980.00'
                diferencia: '-20.00'
                totalTarjeta: '500.00'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoIdempotencia'
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
