  /sincronizaciones-proveedores:
    get:
      tags: [Proveedores]
      operationId: listarSincronizaciones
      summary: Listar sincronizaciones de ofertas
      description: Roles Dueño. Incluye los rechazos y los errores de conexión.
      x-acceptance-criteria:
        - RF-10-AC-2
        - RF-10-AC-5
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Historial de sincronizaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSincronizaciones'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Proveedores]
      operationId: sincronizarProveedores
      summary: Sincronizar las ofertas de los proveedores con base
      description: |
        Roles Dueño. También la dispara el reloj a las 5:00. Lee el código,
        nombre, presentación, factor de conversión, costo, existencia y días de
        entrega de cada proveedor con un adaptador distinto, y los guarda como
        ofertas con los mismos campos comunes. El número de ofertas cargadas
        coincide con el de la base, menos los rechazos. Se rechaza un registro
        con costo vacío o negativo, factor de conversión menor o igual a 0, o
        días de entrega menores que 1; el resto se importa y el resumen lista
        código y motivo. Si la oferta ya existía, se actualiza el costo y la
        fecha, sin cambiar el precio de venta. Un código sin ficha vinculada
        entra a "Productos por vincular" y no crea ficha. Si una base no
        responde, el resumen dice "Error de conexión con <proveedor>", sus
        ofertas previas no cambian y el aviso queda en el panel. La respuesta
        es 201 aunque un proveedor falle: el resumen queda guardado y el otro
        proveedor no se deshace.

        Tiempo de respuesta (RNF-03, hasta 60 segundos): cuando no se envía
        `proveedorId`, los dos proveedores se sincronizan en paralelo, así el
        tiempo del peor caso no se suma. Cada conexión a una base de proveedor
        tiene un límite de 10 segundos; si lo excede, ese proveedor queda como
        "Error de conexión con <proveedor>", sus ofertas previas no cambian y la
        respuesta sigue siendo 201. Si ya hay una sincronización en curso, la
        nueva responde 409 y no se ejecuta.
      x-acceptance-criteria:
        - RF-10-AC-1
        - RF-10-AC-2
        - RF-10-AC-3
        - RF-10-AC-4
        - RF-10-AC-5
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SincronizacionSolicitud'
      responses:
        '201':
          description: Sincronización registrada, incluidos rechazos y errores de conexión.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sincronizacion'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                ejecutadaEn: '2026-10-02T11:00:00Z'
                preciosVentaModificados: 0
                resultados:
                  - proveedorId: 33333333-3333-3333-3333-333333333333
                    proveedorNombre: Proveedor B
                    ofertasCargadas: 97
                    ofertasRechazadas: 3
                    errorConexion: null
                    ofertasPreviasConservadas: false
                    rechazos:
                      - codigo: B-014
                        motivo: Costo vacío o negativo
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya hay una sincronización en curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Ya hay una sincronización en curso
                codigo: SINCRONIZACION_EN_CURSO
        '500':
          $ref: '#/components/responses/ErrorInterno'
