  /webhooks/pagos:
    post:
      tags: [Pagos]
      operationId: recibirWebhookPago
      summary: Recibir una notificación de pago o de reembolso
      description: |
        La llama Mercado Pago (Checkout Pro sandbox) con su propio formato de
        notificación. El adaptador simulado de ServicioPagos envía exactamente el
        mismo formato. No usa JWT. El flujo es:

        1. Verifica `x-signature` con la clave secreta del webhook. El manifiesto
           firmado es `id:<data.id>;request-id:<x-request-id>;ts:<ts>;`. Una
           firma inválida responde 401 y no cambia nada.
        2. Si `type` no es `payment`, responde 200 con resultado IGNORADO.
        3. Con `data.id` consulta el pago en `ServicioPagos`. De esa consulta
           salen el monto, el estado, la fecha, las devoluciones y el folio del
           pedido (`external_reference`). El cuerpo del aviso nunca se usa como
           fuente del monto ni del estado.
        4. Aplica las reglas siguientes, de forma idempotente por referencia
           del pago y estado.

        Pago aprobado por el monto exacto: el pedido pasa a "Pagado", el pago queda
        asociado al folio con monto, fecha, hora y referencia, el cliente recibe
        un correo y el pedido aparece en "Por preparar". Si el pago se confirma
        después de la hora límite (por defecto 19:00), la entrega o la recolección
        queda para el día siguiente, de 9:00 a 20:00. Si el pedido ya estaba
        "Expirado" y hay disponible, se vuelve a apartar y pasa a "Pagado"; si no
        hay disponible, se crea el reembolso total y pasa a "Cancelado". Un pago
        rechazado deja el pedido en "Pendiente de pago", conserva el carrito y el
        cliente ve "Tu pago no fue aprobado, intenta con otro método". Un aprobado
        duplicado responde 200, no repite el cambio y no envía un segundo correo.
        Si el monto no coincide, el pedido no pasa a "Pagado" y se alerta al Dueño
        con "Monto de pago no coincide". Un pago aprobado también genera la alerta
        de reorden cuando el apartado deja la disponible en o bajo el punto de
        reorden.

        Reembolsos: la consulta del pago incluye sus devoluciones. Una devolución
        acreditada pasa el reembolso a "Confirmado" y el cliente recibe el monto
        por correo. Una rechazada pasa a "Fallido", aparece en el panel del Dueño
        con la opción de reintentar y se le envía un correo.
      security:
        - firmaWebhook: []
      x-acceptance-criteria:
        - RF-23-AC-1
        - RF-23-AC-2
        - RF-23-AC-4
        - RF-23-AC-5
        - RF-23-AC-6
        - RF-22-AC-7
        - RF-09-AC-2
        - RF-27-AC-1
        - RF-27-AC-2
      parameters:
        - $ref: '#/components/parameters/FirmaWebhook'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPago'
      responses:
        '200':
          description: Notificación auténtica procesada, incluida la duplicada y la de monto distinto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoWebhook'
              examples:
                pagado:
                  value:
                    aplicado: true
                    resultado: PAGADO
                    mensaje: null
                duplicado:
                  value:
                    aplicado: false
                    resultado: DUPLICADO
                    mensaje: null
                rechazado:
                  value:
                    aplicado: true
                    resultado: RECHAZADO
                    mensaje: Tu pago no fue aprobado, intenta con otro método
                monto:
                  value:
                    aplicado: false
                    resultado: MONTO_NO_COINCIDE
                    mensaje: Monto de pago no coincide
                ignorado:
                  value:
                    aplicado: false
                    resultado: IGNORADO
                    mensaje: null
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: Firma inválida. No hay cambios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Firma inválida
                codigo: FIRMA_INVALIDA
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
