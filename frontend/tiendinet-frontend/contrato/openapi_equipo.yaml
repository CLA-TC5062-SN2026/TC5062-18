          type: integer
        origenPR:
          $ref: '#/components/schemas/OrigenPR'
        cdp:
          type: string
          nullable: true
          pattern: '^\d+\.\d{2}$'
        diasHistorial:
          type: integer
        diasEntregaUsados:
          type: integer
          nullable: true
        origenDiasEntrega:
          type: string
          nullable: true
