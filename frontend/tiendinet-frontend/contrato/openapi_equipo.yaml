      summary: Consultar lotes por caducar y caducados
      description: |
        Roles Dueño y Empleado. "Por caducar" son lotes con existencia cuya
        caducidad está entre hoy y los próximos N días (N sale de la
        configuración; por defecto 3). "Caducados" son los de fecha anterior a
        hoy: se muestran con estado "Caducado", ofrecen registrar la merma y sus
        unidades ya no cuentan como disponibles. Un lote que caduca hoy no está
        en "Caducados" y sí se puede vender.
      x-acceptance-criteria:
