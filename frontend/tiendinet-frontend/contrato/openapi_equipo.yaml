        puedeReintentar:
          type: boolean
    ListaReembolsos:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Reembolso'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    ConfiguracionTienda:
      type: object
      additionalProperties: false
      required: [diasSeguridad, pedidoMinimoEnvio, costoEnvio, horarioInicio, horarioFin, horaLimiteMismoDia, diasAvisoCaducidad, plazoRespuestaFaltanteMin, codigosPostalesEntrega]
      properties:
        diasSeguridad:
