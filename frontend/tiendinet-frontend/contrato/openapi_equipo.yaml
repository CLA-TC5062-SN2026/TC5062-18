  /pedidos:
    get:
      tags: [Pedidos]
      operationId: listarPedidos
      summary: Listar pedidos de la tienda
      description: |
        Roles Dueño y Empleado. `cola=POR_PREPARAR` lista los pagados que aún no
        pasan a preparación, del día de entrega indicado. El teléfono y la
        dirección del cliente solo se incluyen si el pedido está en preparación,
        listo para recoger, listo para enviar o en camino.
      x-acceptance-criteria:
        - RF-22-AC-7
        - RF-24-AC-1
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoPedido'
        - name: cola
          in: query
          schema:
            type: string
            enum: [POR_PREPARAR, REEMBOLSOS_POR_DECIDIR]
        - name: fechaEntrega
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Pedidos de la tienda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPedidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Pedidos]
      operationId: crearPedido
      summary: Crear un pedido anticipado desde el carrito
      description: |
        Roles Cliente. Exige sesión. Sin modalidad, con el carrito vacío, o con
        envío sin dirección, responde 422 e indica lo que falta; no crea el pedido.
        "Recoger en tienda" deja el envío en 0.00 y no usa dirección. El envío
        exige subtotal igual o mayor al mínimo configurado (por defecto $150, con
        el mensaje "El pedido mínimo para envío es de $150") y un código postal
        atendido; si no, "No entregamos en tu código postal; puedes recoger en
        tienda". El costo de envío es el configurado en ese momento. Aparta las
        cantidades 15 minutos, asigna folio y queda en "Pendiente de pago". Un
        producto restringido, aunque el cuerpo lo envíe directo, responde 422 con
        "Producto no disponible en línea" y no crea el pedido. Si la última unidad
        la gana una venta concurrente, este pedido responde 409 con "Producto
        agotado". El carrito se conserva hasta que el pago se apruebe.
      x-acceptance-criteria:
        - RF-22-AC-1
        - RF-22-AC-2
        - RF-22-AC-3
        - RF-22-AC-4
        - RF-22-AC-6
        - RF-22-AC-9
        - RF-16-AC-6
        - RF-01-AC-6
        - RF-28-AC-3
        - RF-28-AC-4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCrear'
      responses:
        '201':
          description: Pedido en "Pendiente de pago", con el apartado de 15 minutos.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: Sin sesión. El portal dirige al inicio de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          description: |
            Otro cobro o pedido concurrente se quedó con la última unidad. También
            responde 409, con código IDEMPOTENCIA_CONFLICTO, si la clave
            Idempotency-Key ya se usó con otro cuerpo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorExistencia'
              example:
                mensaje: Producto agotado
                codigo: SIN_EXISTENCIA
                cantidadSolicitada: 1
                disponible: 0
        '422':
          description: Falta un dato, el mínimo de envío no se cumple, el código postal no se atiende o hay un restringido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                minimo:
                  value:
                    mensaje: El pedido mínimo para envío es de $150
                    codigo: MINIMO_ENVIO
                codigoPostal:
                  value:
                    mensaje: No entregamos en tu código postal; puedes recoger en tienda
                    codigo: CODIGO_POSTAL_NO_ATENDIDO
                restringido:
                  value:
                    mensaje: Producto no disponible en línea
                    codigo: NO_DISPONIBLE_EN_LINEA
                incompleto:
                  value:
                    mensaje: Falta la modalidad, la dirección o el carrito está vacío
                    codigo: PEDIDO_INCOMPLETO
                    detalles:
                      - campo: modalidad
                        mensaje: Elige recoger en tienda o envío a domicilio
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /pedidos/{pedidoId}:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      tags: [Pedidos]
      operationId: obtenerPedido
