  /productos/{productoId}/comparacion:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Ofertas]
      operationId: compararOfertas
      summary: Comparar ofertas normalizadas a la unidad base
      description: |
        Roles Dueño. Ordena de menor a mayor costo por unidad base. La oferta
        vigente de menor costo lleva la etiqueta "Menor costo" y la de menos
        días de entrega, "Entrega más rápida". Una oferta con más de 7 días sin
        actualizar, o con existencia del proveedor en 0, va al final, como
        "No vigente" y sin etiquetas. Una oferta manual sigue la misma regla.
        Si solo hay un proveedor, el mensaje es "Solo un proveedor ofrece este
        producto". Un Empleado recibe 403.
      x-acceptance-criteria:
        - RF-12-AC-1
        - RF-12-AC-2
        - RF-12-AC-3
        - RF-11-AC-2
        - RF-01-AC-3
      responses:
        '200':
          description: Ofertas comparadas por costo de la unidad base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparacionOfertas'
              example:
                productoId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                mensaje: null
                ofertas:
                  - proveedorNombre: Proveedor A
                    presentacion: Caja 12
                    costo: '120.00'
                    factorConversion: 12
                    costoPorUnidadBase: '10.00'
                    existenciaProveedor: 40
                    diasEntrega: 3
                    origen: SINCRONIZADA
                    vigente: true
                    etiquetas: [Menor costo]
                  - proveedorNombre: Proveedor B
                    presentacion: Paquete 6
                    costo: '66.00'
                    factorConversion: 6
                    costoPorUnidadBase: '11.00'
                    existenciaProveedor: 20
                    diasEntrega: 1
                    origen: SINCRONIZADA
                    vigente: true
                    etiquetas: [Entrega más rápida]
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos/{productoId}/sugerencia:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Ofertas]
      operationId: sugerirProveedor
      summary: Sugerir proveedor para la cantidad a resurtir
      description: |
        Roles Dueño. Entre las ofertas vigentes cuya existencia alcanza la
        cantidad sugerida, elige la de menor costo por unidad base. Con
        `urgencia=true`, elige la de menos días de entrega. Un empate se resuelve
        con el otro criterio. Si ninguna oferta vigente tiene existencia
        suficiente, `proveedorId` es null y el mensaje es "Sin proveedor con
        existencia". No modifica el precio de venta.
      x-acceptance-criteria:
        - RF-13-AC-1
        - RF-13-AC-2
        - RF-13-AC-3
        - RF-13-AC-5
      parameters:
        - name: urgencia
          in: query
          description: Si es verdadero, prioriza los días de entrega sobre el costo.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Sugerencia, o mensaje de que no hay proveedor con existencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugerenciaProveedor'
              examples:
                porCosto:
                  value:
                    haySugerencia: true
                    proveedorId: 11111111-1111-1111-1111-111111111111
                    proveedorNombre: Proveedor A
                    criterio: MENOR_COSTO
                    costoPorUnidadBase: '10.00'
                    diasEntrega: 3
                    mensaje: null
                sinExistencia:
                  value:
                    haySugerencia: false
                    proveedorId: null
                    proveedorNombre: null
                    criterio: null
                    costoPorUnidadBase: null
                    diasEntrega: null
                    mensaje: Sin proveedor con existencia
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /inventario/productos:
