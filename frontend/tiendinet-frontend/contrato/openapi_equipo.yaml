          $ref: '#/components/schemas/Dinero'
        costoEnvio:
          $ref: '#/components/schemas/Dinero'
        horarioInicio:
          $ref: '#/components/schemas/Hora'
        horarioFin:
          $ref: '#/components/schemas/Hora'
        horaLimiteMismoDia:
          $ref: '#/components/schemas/Hora'
        diasAvisoCaducidad:
          type: integer
          minimum: 0
        plazoRespuestaFaltanteMin:
          type: integer
          minimum: 1
        codigosPostalesEntrega:
          type: array
          description: |
            Códigos postales activos. Se administran en
            `/configuracion/codigos-postales`. Este arreglo no se reemplaza
            con PATCH.
          items:
            type: string
            pattern: '^\d{5}$'
    ConfiguracionActualizar:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Uno o más parámetros. Lo que no se envía conserva su valor. Los códigos
        postales no forman parte de este cuerpo.
      properties:
        diasSeguridad:
          type: integer
          minimum: 0
          maximum: 14
        pedidoMinimoEnvio:
          $ref: '#/components/schemas/Dinero'
        costoEnvio:
          $ref: '#/components/schemas/Dinero'
        horarioInicio:
          $ref: '#/components/schemas/Hora'
        horarioFin:
          $ref: '#/components/schemas/Hora'
        horaLimiteMismoDia:
          $ref: '#/components/schemas/Hora'
        diasAvisoCaducidad:
          type: integer
          minimum: 0
        plazoRespuestaFaltanteMin:
          type: integer
          minimum: 1
    CodigoPostalCrear:
      type: object
