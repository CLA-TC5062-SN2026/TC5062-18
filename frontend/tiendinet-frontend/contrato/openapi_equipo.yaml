  /configuracion:
    get:
      tags: [Configuración]
      operationId: obtenerConfiguracion
      summary: Consultar la configuración de la tienda
      description: Roles Dueño. Un Empleado o un Cliente reciben 403.
      x-acceptance-criteria:
        - RF-28-AC-1
      responses:
        '200':
          description: Configuración vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionTienda'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [Configuración]
      operationId: actualizarConfiguracion
      summary: Cambiar uno o más parámetros de la tienda
      description: |
        Roles Dueño. Se envía solo lo que cambia. Los demás parámetros conservan
        su valor. Un cuerpo vacío o con un campo desconocido no se guarda.

        Cubre días de seguridad (0 a 14), pedido mínimo, costo de envío, horario,
        hora límite del mismo día, días de aviso de caducidad y plazo de respuesta
        ante faltantes. 20 días de seguridad responden 422 con "Los días de
        seguridad deben estar entre 0 y 14". El siguiente cálculo del punto de
        reorden usa los días de seguridad nuevos. El costo de envío nuevo aplica
        solo a pedidos creados después; los anteriores conservan el suyo.

        Los códigos postales no se editan aquí. Agregar 72000 es
        `POST /configuracion/codigos-postales`.
      x-acceptance-criteria:
        - RF-28-AC-1
        - RF-28-AC-2
        - RF-28-AC-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracionActualizar'
            example:
              diasSeguridad: 3
              costoEnvio: '30.00'
      responses:
        '200':
          description: Configuración vigente después del cambio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionTienda'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          description: |
            Algún parámetro está fuera de rango, o el cuerpo no trae ningún campo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Los días de seguridad deben estar entre 0 y 14
                codigo: DIAS_SEGURIDAD_INVALIDOS
                detalles:
                  - campo: diasSeguridad
                    mensaje: Los días de seguridad deben estar entre 0 y 14
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /configuracion/codigos-postales:
    get:
      tags: [Configuración]
      operationId: listarCodigosPostales
      summary: Listar los códigos postales de la zona de entrega
      description: |
        Roles Dueño. Incluye activos e inactivos. El catálogo público y
        `GET /configuracion` solo exponen los activos.
      x-acceptance-criteria:
        - RF-28-AC-4
      responses:
        '200':
          description: Códigos postales configurados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaCodigosPostales'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Configuración]
      operationId: agregarCodigoPostal
      summary: Agregar un código postal a la zona de entrega
      description: |
        Roles Dueño. El código queda activo. A partir de ese momento un cliente
        con ese código puede elegir envío. Los pedidos ya creados no cambian.
        Si el código ya existe, responde 409. Para volver a activar uno
        desactivado se usa PATCH sobre ese código.
      x-acceptance-criteria:
        - RF-28-AC-4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoPostalCrear'
            example:
              codigo: '72000'
      responses:
        '201':
          description: Código postal agregado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigoPostalEntrega'
              example:
                codigo: '72000'
                activo: true
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          description: El código postal ya está registrado, activo o inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Este código postal ya está en la zona de entrega
                codigo: CODIGO_POSTAL_DUPLICADO
        '422':
          description: El código no tiene 5 dígitos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: El código postal debe tener 5 dígitos
                codigo: CODIGO_POSTAL_INVALIDO
                detalles:
                  - campo: codigo
                    mensaje: El código postal debe tener 5 dígitos
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /configuracion/codigos-postales/{codigo}:
    parameters:
      - name: codigo
        in: path
        required: true
        description: Código postal de 5 dígitos.
        schema:
          type: string
          pattern: '^\d{5}$'
    get:
      tags: [Configuración]
      operationId: obtenerCodigoPostal
      summary: Consultar un código postal de entrega
      description: Roles Dueño.
      x-acceptance-criteria:
        - RF-28-AC-4
      responses:
        '200':
          description: Código postal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigoPostalEntrega'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [Configuración]
      operationId: cambiarEstadoCodigoPostal
      summary: Activar o desactivar un código postal
      description: |
        Roles Dueño. Desactivar lo saca de la zona para pedidos nuevos. Los
        pedidos ya creados conservan su dirección. No se borra el registro.
      x-acceptance-criteria:
        - RF-28-AC-4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoPostalEstado'
      responses:
        '200':
          description: Código postal con su estado nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigoPostalEntrega'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /configuracion/publica:
    get:
      tags: [Configuración]
      operationId: obtenerConfiguracionPublica
      summary: Consultar las reglas de entrega visibles para el cliente
      description: |
        Público. Solo devuelve pedido mínimo, costo de envío, horario, hora límite
        y códigos postales activos. No incluye días de seguridad ni otros parámetros
        internos.
      security: []
      x-acceptance-criteria:
        - RF-22-AC-2
        - RF-22-AC-3
        - RF-28-AC-3
        - RF-28-AC-4
      responses:
        '200':
          description: Reglas de entrega.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionPublica'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /reportes/diario:
    get:
      tags: [Reportes]
      operationId: reporteDiario
      summary: Consultar el reporte diario de ventas
      description: |
        Roles Dueño. Un Empleado recibe 403. Muestra número e importe de ventas
        completadas de mostrador y en línea por separado, número e importe bruto
        de cancelaciones, y el total neto (completado menos cancelado). Sin
        movimientos, el mensaje es "No hay ventas en el periodo seleccionado".
      x-acceptance-criteria:
        - RF-29-AC-1
        - RF-29-AC-4
        - RF-29-AC-5
      parameters:
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reporte del día de negocio indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteDiario'
              examples:
                conVentas:
                  value:
                    fecha: '2026-10-02'
                    mostrador:
                      numero: 12
                      importe: '1000.00'
                    enLinea:
                      numero: 3
                      importe: '450.00'
                    cancelaciones:
                      numero: 1
                      importeBruto: '100.00'
                    totalNeto: '1350.00'
                    mensaje: null
                sinMovimientos:
                  value:
                    fecha: '2026-10-02'
                    mostrador:
                      numero: 0
                      importe: '0.00'
                    enLinea:
                      numero: 0
                      importe: '0.00'
                    cancelaciones:
                      numero: 0
                      importeBruto: '0.00'
                    totalNeto: '0.00'
                    mensaje: No hay ventas en el periodo seleccionado
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /reportes/rotacion:
    get:
      tags: [Reportes]
      operationId: reporteRotacion
      summary: Consultar la rotación de productos
      description: |
        Roles Dueño. Un Empleado recibe 403. Ordena los productos de más a menos
        unidades vendidas en el periodo. No cuenta las canceladas ni la merma.
        Sin movimientos, la lista va vacía y el mensaje indica que no hay ventas.
      x-acceptance-criteria:
        - RF-29-AC-2
        - RF-29-AC-4
        - RF-29-AC-5
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Productos ordenados por unidades vendidas, sin cancelaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteRotacion'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          description: La fecha final es anterior a la inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /reportes/indicadores:
    get:
      tags: [Reportes]
      operationId: reporteIndicadores
      summary: Consultar faltantes, diferencia de caja y pedidos en línea
      description: |
        Roles Dueño. Un Empleado recibe 403. Un faltante es un producto que llegó
        a disponible 0 en el periodo. La diferencia suma la de los cortes. Los
        pedidos son los pagados en línea. Sin movimientos: 0 faltantes, diferencia
        0.00, 0 pedidos y el mensaje de periodo sin ventas.
      x-acceptance-criteria:
        - RF-29-AC-3
        - RF-29-AC-4
        - RF-29-AC-5
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Indicadores del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteIndicadores'
              examples:
                conDatos:
                  value:
                    desde: '2026-09-01'
                    hasta: '2026-09-30'
                    faltantes: 2
                    diferenciaCaja: '-45.00'
                    pedidosEnLinea: 18
                    mensaje: null
                sinMovimientos:
                  value:
                    desde: '2026-09-01'
                    hasta: '2026-09-30'
                    faltantes: 0
                    diferenciaCaja: '0.00'
                    pedidosEnLinea: 0
                    mensaje: No hay ventas en el periodo seleccionado
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          description: La fecha final es anterior a la inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /tareas/calcular-puntos-reorden:
    post:
      tags: [Tareas]
      operationId: calcularPuntosReorden
      summary: Recalcular los puntos de reorden
      description: |
        Roles Dueño. El reloj la dispara a las 6:00. Con al menos 14 días de
        historial, el punto de reorden queda en el techo de
        CDP × (días de entrega + días de seguridad). El CDP usa los últimos
        d = min(28, días de historial), sin cancelaciones ni merma. Sin esos 14
        días se conserva el inicial y el mensaje es "Historial insuficiente".
        Un punto de reorden manual vigente tiene prioridad. Sin oferta vigente del
        preferido se usan los días de entrega de respaldo; si tampoco hay, se
        conserva el valor y el mensaje es "Sin proveedor con oferta vigente".
        Los días de seguridad son los de la configuración.
      x-acceptance-criteria:
        - RF-08-AC-3
        - RF-08-AC-4
        - RF-08-AC-5
        - RF-08-AC-6
        - RF-28-AC-1
      requestBody:
        required: false
        description: |
          Opcional. Si se envía `fechaReferencia`, la tarea usa ese instante
          como ahora. Sin cuerpo, usa el reloj del sistema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojReferencia'
      responses:
        '200':
          description: Resultado del cálculo por producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCalculoPR'
              example:
                ejecutadaEn: '2026-10-02T12:00:00Z'
                productos:
                  - productoId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    prVigente: 16
                    origenPR: CALCULADO
                    cdp: '4.00'
                    diasHistorial: 28
                    diasEntregaUsados: 2
                    origenDiasEntrega: OFERTA_PREFERIDO
                    diasSeguridad: 2
                    mensaje: null
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /tareas/avisos-caducidad:
    post:
      tags: [Tareas]
      operationId: enviarAvisosCaducidad
      summary: Enviar el resumen diario de caducidades
      description: |
        Roles Dueño. El reloj la dispara a las 7:00. Arma las listas "Por caducar"
        y "Caducados" y envía el resumen por correo al Dueño. Los caducados dejan
        de contar como disponibles.
      x-acceptance-criteria:
        - RF-07-AC-2
        - RF-07-AC-3
      requestBody:
        required: false
        description: |
          Opcional. Si se envía `fechaReferencia`, la tarea usa ese instante
          como ahora. Sin cuerpo, usa el reloj del sistema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojReferencia'
      responses:
        '200':
          description: Resumen enviado. Incluye las dos listas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAvisosCaducidad'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /tareas/expirar-pedidos:
    post:
      tags: [Tareas]
      operationId: expirarPedidos
      summary: Expirar apartados y cancelar pedidos expirados
      description: |
        Roles Dueño. El reloj la dispara. Un pedido con 15 minutos en "Pendiente
        de pago" pasa a "Expirado" y se libera su apartado; si eso deja la
        disponible por encima del punto de reorden, la alerta pasa a resuelta.
        Un pedido expirado desde hace 24 horas pasa a "Cancelado".
      x-acceptance-criteria:
        - RF-22-AC-8
        - RF-09-AC-5
      requestBody:
        required: false
        description: |
          Opcional. Si se envía `fechaReferencia`, la tarea usa ese instante
          como ahora. Sin cuerpo, usa el reloj del sistema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojReferencia'
      responses:
        '200':
          description: Pedidos expirados y, en su caso, cancelados a las 24 horas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoTareaPedidos'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /tareas/conciliar-pagos:
    post:
      tags: [Tareas]
      operationId: conciliarPagos
      summary: Conciliar pagos y reembolsos con ServicioPagos
      description: |
        Roles Dueño. El reloj la dispara cada 10 minutos. Revisa pedidos
        "Pendiente de pago" o "Expirado" de las últimas 24 horas cuyo webhook no
        llegó, y les aplica el mismo resultado que a una notificación auténtica.
        También confirma o marca fallidos los reembolsos pendientes.
      x-acceptance-criteria:
        - RF-23-AC-3
        - RF-23-AC-1
        - RF-23-AC-2
        - RF-27-AC-1
        - RF-27-AC-2
      requestBody:
        required: false
        description: |
          Opcional. Si se envía `fechaReferencia`, la tarea usa ese instante
          como ahora. Sin cuerpo, usa el reloj del sistema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojReferencia'
      responses:
        '200':
          description: Pedidos y reembolsos conciliados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoConciliacion'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /tareas/marcar-no-recogidos:
    post:
      tags: [Tareas]
      operationId: marcarNoRecogidos
      summary: Pasar a no recogido lo que venció en tienda
      description: |
        Roles Dueño. El reloj la dispara a las 20:00. Un pedido "Listo para
        recoger" desde el día D pasa a "No recogido" a las 20:00 del día D+1,
        libera su apartado y aparece en "Reembolsos por decidir".
      x-acceptance-criteria:
        - RF-24-AC-7
      requestBody:
        required: false
        description: |
          Opcional. Si se envía `fechaReferencia`, la tarea usa ese instante
          como ahora. Sin cuerpo, usa el reloj del sistema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojReferencia'
      responses:
        '200':
          description: Pedidos marcados como no recogidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoTareaPedidos'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /tareas/resolver-faltantes-vencidos:
    post:
      tags: [Tareas]
      operationId: resolverFaltantesVencidos
      summary: Reembolsar faltantes sin respuesta del cliente
      description: |
        Roles Dueño. El reloj la dispara. Si el cliente no responde en el plazo
        configurado (por defecto 30 minutos), se aplica el reembolso del faltante
        y se conserva el costo de envío cuando el subtotal baja del mínimo.
      x-acceptance-criteria:
        - RF-25-AC-4
        - RF-25-AC-5
      requestBody:
        required: false
        description: |
          Opcional. Si se envía `fechaReferencia`, la tarea usa ese instante
          como ahora. Sin cuerpo, usa el reloj del sistema.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelojReferencia'
      responses:
        '200':
          description: Faltantes vencidos reembolsados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoTareaPedidos'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT con `sub`, `rol` (`DUENO`, `EMPLEADO` o `CLIENTE`) y `correo`.
        Dura 60 minutos para Dueño y Empleado, y 24 horas para el Cliente.
        Si la cuenta se desactivó, cualquier operación protegida responde 401
        aunque el token siga vigente.
    firmaWebhook:
      type: apiKey
      in: header
      name: x-signature
      description: |
        Firma que Mercado Pago envía en cada notificación, con el formato
        `ts=<marca de tiempo>,v1=<hash>`. El hash es HMAC-SHA256, con la clave
        secreta del webhook, del manifiesto
        `id:<data.id>;request-id:<x-request-id>;ts:<ts>;`. Una firma inválida
        responde 401 y no modifica pedidos ni reembolsos.
  headers:
    Location:
      description: URL del recurso creado.
      schema:
        type: string
        format: uri
    IdempotencyReplayed:
      description: |
        Vale true cuando la respuesta viene de la caché de idempotencia y la
        operación no se volvió a ejecutar.
      schema:
        type: boolean
  parameters:
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamano:
      name: tamano
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TextoBusqueda:
      name: q
      in: query
      description: Texto libre. En productos y en el POS no distingue mayúsculas ni acentos.
      schema:
        type: string
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecepcionId:
      name: recepcionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertaId:
      name: alertaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProveedorId:
      name: proveedorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SincronizacionId:
      name: sincronizacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VinculacionId:
      name: vinculacionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfertaId:
      name: ofertaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropuestaId:
      name: propuestaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RenglonId:
      name: renglonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VentaId:
      name: ventaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorteId:
      name: corteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PedidoId:
      name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReembolsoId:
      name: reembolsoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FirmaWebhook:
      name: x-signature
      in: header
      required: true
      description: 'Firma de Mercado Pago: ts=<marca de tiempo>,v1=<HMAC-SHA256 en hexadecimal>.'
      schema:
        type: string
        example: ts=1704908010,v1=618c85345248dd820d5fd456117c2ab2ef8eda45a0282ff693eac24131a5e839
    XRequestId:
      name: x-request-id
      in: header
      required: true
      description: Identificador de la notificación que envía Mercado Pago. Forma parte del manifiesto firmado.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID que genera el cliente para cada operación lógica (un cobro, una
        recepción, un pedido). Un reintento con la misma clave y el mismo
        cuerpo dentro de 24 horas devuelve la respuesta original sin volver a
        ejecutar la operación. La misma clave con otro cuerpo responde 409.
      schema:
        type: string
        format: uuid
  responses:
    PeticionInvalida:
      description: El cuerpo no es JSON o un tipo es incompatible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: El cuerpo de la petición no es JSON válido.
            codigo: PETICION_INVALIDA
    NoAutorizado:
      description: |
        Falta el token, es inválido, la contraseña no coincide o la cuenta está
        inactiva. Un usuario desactivado con JWT vigente también recibe 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: Correo o contraseña incorrectos
            codigo: NO_AUTORIZADO
    Prohibido:
      description: El rol autenticado no puede ejecutar esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: No tienes permiso para esta operación.
            codigo: PROHIBIDO
    NoEncontrado:
      description: El recurso no existe, o no debe revelarse a quien pregunta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: No encontrado
            codigo: NO_ENCONTRADO
    EntidadNoProcesable:
      description: El JSON es válido, pero un campo o una regla de negocio no se cumple. La respuesta indica el campo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: Revisa los campos marcados.
            codigo: DATOS_INVALIDOS
            detalles:
              - campo: precioVenta
                mensaje: El precio no puede ser negativo.
    ErrorInterno:
      description: Fallo no previsto. No incluye detalle interno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: Ocurrió un error. Intenta de nuevo.
            codigo: ERROR_INTERNO
    ConflictoIdempotencia:
      description: La clave Idempotency-Key ya se usó con un cuerpo distinto. No se ejecuta nada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            mensaje: La clave de idempotencia ya se usó con otra operación
            codigo: IDEMPOTENCIA_CONFLICTO
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [mensaje]
      properties:
        mensaje:
          type: string
        codigo:
          type: string
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleError'
    DetalleError:
      type: object
      additionalProperties: false
      required: [campo, mensaje]
      properties:
        campo:
          type: string
        mensaje:
          type: string
    ErrorLimite:
      type: object
      additionalProperties: false
      required: [mensaje, reintentaEnSegundos]
      properties:
        mensaje:
          type: string
        codigo:
          type: string
        reintentaEnSegundos:
          type: integer
    ErrorExistencia:
      type: object
      additionalProperties: false
      required: [mensaje]
      properties:
        mensaje:
          type: string
          example: Producto agotado
        codigo:
          type: string
        productoId:
          type: string
          format: uuid
        nombreProducto:
          type: string
        cantidadSolicitada:
          type: integer
        disponible:
          type: integer
    ErrorFaltantePago:
      type: object
      additionalProperties: false
      required: [mensaje, faltante]
      properties:
        mensaje:
          type: string
        codigo:
          type: string
        faltante:
          $ref: '#/components/schemas/Dinero'
    Mensaje:
      type: object
      additionalProperties: false
      required: [mensaje]
      properties:
        mensaje:
          type: string
    Dinero:
      type: string
      description: Importe en MXN con IVA incluido y exactamente dos decimales.
      pattern: '^\d+\.\d{2}$'
      example: '38.50'
    DineroConSigno:
      type: string
      description: Importe en MXN con dos decimales. Puede ser negativo, como la diferencia de caja.
      pattern: '^-?\d+\.\d{2}$'
      example: '-20.00'
    Hora:
      type: string
      description: Hora de negocio en formato HH:MM, interpretada en America/Mexico_City.
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '09:00'
    Rol:
      type: string
      enum: [DUENO, EMPLEADO, CLIENTE]
    EstadoUsuario:
      type: string
      enum: [ACTIVO, INACTIVO]
    InicioSesion:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
    Sesion:
      type: object
      additionalProperties: false
      required: [token, tipo, expiraEn, usuario]
      properties:
        token:
          type: string
          description: JWT. El claim `rol` trae DUENO, EMPLEADO o CLIENTE.
        tipo:
          type: string
          enum: [Bearer]
        expiraEn:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
    UsuarioResumen:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol, estado]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
    SolicitudRecuperacion:
      type: object
      additionalProperties: false
      required: [correo]
      properties:
        correo:
          type: string
          format: email
    RestablecerContrasena:
      type: object
      additionalProperties: false
      required: [token, contrasena]
      properties:
        token:
          type: string
        contrasena:
          type: string
          format: password
          minLength: 8
          description: Al menos 8 caracteres, con una letra y un número.
    Direccion:
      type: object
      additionalProperties: false
      required: [calle, codigoPostal]
      properties:
        calle:
          type: string
          minLength: 1
        codigoPostal:
          type: string
          pattern: '^\d{5}$'
    RegistroCliente:
      type: object
      additionalProperties: false
      required: [nombre, correo, telefono, contrasena, direccion, avisoPrivacidadAceptado]
      properties:
        nombre:
          type: string
          minLength: 1
        correo:
          type: string
          format: email
        telefono:
          type: string
          pattern: '^\d{10}$'
        contrasena:
          type: string
          format: password
          minLength: 8
          description: Al menos 8 caracteres, con una letra y un número.
        direccion:
          $ref: '#/components/schemas/Direccion'
        avisoPrivacidadAceptado:
          type: boolean
          description: Debe ser verdadero. Si no, la respuesta es 422.
    Cliente:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, telefono, rol, estado, direccion]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
        rol:
          type: string
          enum: [CLIENTE]
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        direccion:
          $ref: '#/components/schemas/Direccion'
    ActivacionUsuario:
      type: object
      additionalProperties: false
      required: [token, contrasena]
      properties:
        token:
          type: string
        contrasena:
          type: string
          format: password
          minLength: 8
          description: Al menos 8 caracteres, con una letra y un número.
    UsuarioCrear:
      type: object
      additionalProperties: false
      required: [nombre, correo, rol]
      properties:
        nombre:
          type: string
          minLength: 1
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [DUENO, EMPLEADO]
    UsuarioEstado:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
    UsuarioTienda:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol, estado, activacionEnviada]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [DUENO, EMPLEADO]
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        activacionEnviada:
          type: boolean
    ListaUsuarios:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioTienda'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    EstadoProducto:
      type: string
      enum: [ACTIVO, INACTIVO]
    OrigenPR:
      type: string
      enum: [INICIAL, CALCULADO, MANUAL]
    ProductoCrear:
      type: object
      additionalProperties: false
      required: [nombre, presentacion, categoria, precioVenta, costoReferencia, prInicial, perecedero, restringido]
      properties:
        codigoBarras:
          type: string
          nullable: true
          pattern: '^\d{13}$'
          description: EAN-13 opcional. Si se envía, es único.
        nombre:
          type: string
          minLength: 1
        presentacion:
          type: string
          minLength: 1
        categoria:
          type: string
          minLength: 1
        precioVenta:
          $ref: '#/components/schemas/Dinero'
        costoReferencia:
          $ref: '#/components/schemas/Dinero'
        prInicial:
          type: integer
          minimum: 0
        perecedero:
          type: boolean
        restringido:
          type: boolean
          description: Alcohol o tabaco. Se vende solo en el POS.
        diasEntregaRespaldo:
          type: integer
          minimum: 1
          nullable: true
    ProductoReemplazo:
      type: object
      additionalProperties: false
      required: [nombre, presentacion, categoria, precioVenta, costoReferencia, perecedero, restringido]
      properties:
        codigoBarras:
          type: string
          nullable: true
          pattern: '^\d{13}$'
        nombre:
          type: string
          minLength: 1
        presentacion:
          type: string
          minLength: 1
        categoria:
          type: string
          minLength: 1
        precioVenta:
          $ref: '#/components/schemas/Dinero'
        costoReferencia:
          $ref: '#/components/schemas/Dinero'
        perecedero:
          type: boolean
        restringido:
          type: boolean
    CambioEstadoProducto:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoProducto'
    Producto:
      type: object
      additionalProperties: false
      required: [id, codigoInterno, nombre, presentacion, categoria, precioVenta, costoReferencia, prInicial, prVigente, origenPR, perecedero, restringido, estado, marcaDescuadre, existenciaFisica, apartado, existenciaDisponible]
      properties:
        id:
          type: string
          format: uuid
        codigoInterno:
          type: string
          readOnly: true
        codigoBarras:
          type: string
          nullable: true
        nombre:
          type: string
        presentacion:
          type: string
        categoria:
          type: string
        precioVenta:
          $ref: '#/components/schemas/Dinero'
        costoReferencia:
          $ref: '#/components/schemas/Dinero'
        prInicial:
          type: integer
        prVigente:
          type: integer
        origenPR:
          $ref: '#/components/schemas/OrigenPR'
        prManual:
          type: integer
          nullable: true
        vigenciaPRManual:
          type: string
          format: date
          nullable: true
        diasEntregaRespaldo:
          type: integer
          nullable: true
        proveedorPreferidoId:
          type: string
          format: uuid
          nullable: true
        perecedero:
          type: boolean
        restringido:
          type: boolean
        estado:
          $ref: '#/components/schemas/EstadoProducto'
        marcaDescuadre:
          type: boolean
        existenciaFisica:
          type: integer
        apartado:
          type: integer
          description: Unidades comprometidas por pedidos en línea aún no entregados.
        existenciaDisponible:
          type: integer
          description: Existencia física menos apartado menos unidades de lotes caducados.
    ListaProductos:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    CostoProducto:
      type: object
      additionalProperties: false
      required: [productoId, costoReferencia]
      properties:
        productoId:
          type: string
          format: uuid
        costoReferencia:
          $ref: '#/components/schemas/Dinero'
    PuntoReordenInicial:
      type: object
      additionalProperties: false
      required: [prInicial]
      properties:
        prInicial:
          type: integer
          minimum: 0
          description: Entero mayor o igual a 0. Un decimal se rechaza con 422.
    PuntoReordenManual:
      type: object
      additionalProperties: false
      required: [prManual, vigencia]
      properties:
        prManual:
          type: integer
          minimum: 0
        vigencia:
          type: string
          format: date
          description: Inclusive. Al día siguiente deja de tener prioridad.
    DiasEntregaRespaldo:
      type: object
      additionalProperties: false
      required: [diasEntregaRespaldo]
      properties:
        diasEntregaRespaldo:
          type: integer
          minimum: 1
    ProveedorPreferido:
      type: object
      additionalProperties: false
      required: [proveedorId]
      properties:
        proveedorId:
          type: string
          format: uuid
    PuntoReorden:
      type: object
      additionalProperties: false
      required: [productoId, prInicial, prVigente, origenPR, diasSeguridad]
      properties:
        productoId:
          type: string
          format: uuid
        prInicial:
          type: integer
        prVigente:
          type: integer
        origenPR:
          $ref: '#/components/schemas/OrigenPR'
        prManual:
          type: integer
          nullable: true
        vigenciaPRManual:
          type: string
          format: date
          nullable: true
        cdp:
          type: string
          nullable: true
          description: Consumo diario promedio. Null si el historial no alcanza 14 días.
          pattern: '^\d+\.\d{2}$'
        diasHistorial:
          type: integer
        diasEntregaUsados:
          type: integer
          nullable: true
        origenDiasEntrega:
          type: string
          nullable: true
          enum: [OFERTA_PREFERIDO, RESPALDO, NINGUNO]
        diasSeguridad:
          type: integer
        mensaje:
          type: string
          nullable: true
          description: |
            "Historial insuficiente" o "Sin proveedor con oferta vigente", cuando aplica.
    ProductoInventario:
      type: object
      additionalProperties: false
      required: [id, nombre, presentacion, perecedero, estado, existenciaFisica, apartado, existenciaDisponible, marcaDescuadre]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        presentacion:
          type: string
        categoria:
          type: string
        perecedero:
          type: boolean
        estado:
          $ref: '#/components/schemas/EstadoProducto'
        existenciaFisica:
          type: integer
        apartado:
          type: integer
        existenciaDisponible:
          type: integer
        marcaDescuadre:
          type: boolean
    ListaProductosInventario:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoInventario'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    Lote:
      type: object
      additionalProperties: false
      required: [id, productoId, cantidad, recibidoEn, caducado]
      properties:
        id:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        cantidad:
          type: integer
        fechaCaducidad:
          type: string
          format: date
          nullable: true
        costoUnitario:
          type: string
          nullable: true
          description: Null para el Empleado. El Dueño lo ve cuando se capturó o vino de una oferta.
          pattern: '^\d+\.\d{2}$'
        proveedorId:
          type: string
          format: uuid
          nullable: true
        ofertaId:
          type: string
          format: uuid
          nullable: true
          description: Null cuando el proveedor es "Otro (ruta)".
        recibidoEn:
          type: string
          format: date-time
        caducado:
          type: boolean
          description: Verdadero solo si la caducidad es anterior a hoy. Un lote que caduca hoy no está caducado.
    ListaLotes:
      type: object
      additionalProperties: false
      required: [productoId, lotes]
      properties:
        productoId:
          type: string
          format: uuid
        lotes:
          type: array
          items:
            $ref: '#/components/schemas/Lote'
    TipoMovimiento:
      type: string
      enum: [RECEPCION, VENTA, MERMA, CONTEO, CANCELACION, ENTREGA_PEDIDO]
    MovimientoInventario:
      type: object
      additionalProperties: false
      required: [id, tipo, productoId, cantidad, cantidadAnterior, cantidadNueva, fechaHora]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoMovimiento'
        productoId:
          type: string
          format: uuid
        loteId:
          type: string
          format: uuid
          nullable: true
        cantidad:
          type: integer
          description: Delta con signo. Negativo es una salida.
        cantidadAnterior:
          type: integer
        cantidadNueva:
          type: integer
        motivo:
          type: string
          nullable: true
        usuarioId:
          type: string
          format: uuid
        usuarioNombre:
          type: string
        fechaHora:
          type: string
          format: date-time
    ListaMovimientos:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/MovimientoInventario'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    RecepcionCrear:
      type: object
      additionalProperties: false
      required: [productoId, proveedorId, cantidad]
      properties:
        productoId:
          type: string
          format: uuid
        proveedorId:
          type: string
          format: uuid
          description: Incluye el proveedor sembrado "Otro (ruta)".
        cantidad:
          type: integer
          minimum: 1
        fechaCaducidad:
          type: string
          format: date
          nullable: true
          description: Obligatoria si el producto es perecedero.
        costoUnitario:
          type: string
          nullable: true
          description: Solo el Dueño lo aplica. Si lo envía un Empleado, se ignora.
          pattern: '^\d+\.\d{2}$'
    Recepcion:
      type: object
      additionalProperties: false
      required: [id, productoId, proveedorId, cantidad, existenciaFisica, existenciaDisponible, costoIgnorado, lote]
      properties:
        id:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        proveedorId:
          type: string
          format: uuid
        cantidad:
          type: integer
        existenciaFisica:
          type: integer
        existenciaDisponible:
          type: integer
        costoIgnorado:
          type: boolean
          description: Verdadero cuando un Empleado envió costo y el sistema no lo usó.
        movimientoId:
          type: string
          format: uuid
        lote:
          $ref: '#/components/schemas/Lote'
    ListaRecepciones:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Recepcion'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    AjusteCrear:
      type: object
      additionalProperties: false
      required: [tipo, productoId, motivo]
      properties:
        tipo:
          type: string
          enum: [MERMA, CONTEO]
        productoId:
          type: string
          format: uuid
        loteId:
          type: string
          format: uuid
          nullable: true
          description: Obligatorio cuando el tipo es MERMA.
        cantidad:
          type: integer
          minimum: 1
          description: Unidades de la merma. No se envía en un conteo.
        cantidadContada:
          type: integer
          minimum: 0
          description: Existencia física contada. Obligatoria cuando el tipo es CONTEO.
        motivo:
          type: string
          minLength: 1
    Ajuste:
      type: object
      additionalProperties: false
      required: [id, tipo, productoId, cantidadAnterior, cantidadNueva, motivo, marcaDescuadre]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [MERMA, CONTEO]
        productoId:
          type: string
          format: uuid
        loteId:
          type: string
          format: uuid
          nullable: true
        cantidadAnterior:
          type: integer
        cantidadNueva:
          type: integer
        delta:
          type: integer
        motivo:
          type: string
        cuentaParaCdp:
          type: boolean
          description: Falso en una merma.
        marcaDescuadre:
          type: boolean
          description: Un conteo la deja en falso.
        usuarioId:
          type: string
          format: uuid
        fechaHora:
          type: string
          format: date-time
    ListaAjustes:
      type: object
      additionalProperties: false
      required: [datos, pagina, tamano, total]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Ajuste'
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    LoteCaducidad:
      type: object
      additionalProperties: false
      required: [loteId, productoId, nombreProducto, cantidad, fechaCaducidad, estado]
      properties:
        loteId:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        nombreProducto:
          type: string
        cantidad:
          type: integer
        fechaCaducidad:
          type: string
          format: date
        estado:
