  /carrito/renglones:
    post:
      tags: [Carrito]
      operationId: agregarRenglonCarrito
      summary: Agregar un producto al carrito
      description: |
        Roles Cliente. La cantidad es un entero positivo. Si pide más de la
        disponible, no agrega esa cantidad y responde 422 con "Solo hay N
        disponibles". Un agotado responde 422 con "Agotado". Un restringido
        responde 422 con "Producto no disponible en línea".
      x-acceptance-criteria:
        - RF-22-AC-5
        - RF-21-AC-3
        - RF-22-AC-9
        - RF-01-AC-6
