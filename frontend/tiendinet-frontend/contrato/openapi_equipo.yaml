  /productos/{productoId}/punto-reorden:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Productos]
      operationId: obtenerPuntoReorden
      summary: Consultar el detalle del punto de reorden
      description: |
        Roles Dueño. Incluye el origen del valor (inicial, calculado o manual),
        el consumo diario promedio, los días de historial, el origen de los días
        de entrega y los días de seguridad. Si no hay 14 días de historial, el
        mensaje es "Historial insuficiente". Si no hay días de entrega utilizables,
        el mensaje es "Sin proveedor con oferta vigente".
      x-acceptance-criteria:
        - RF-08-AC-4
        - RF-08-AC-6
        - RF-08-AC-7
      responses:
        '200':
          description: Detalle del punto de reorden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoReorden'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [Productos]
      operationId: actualizarPuntoReordenInicial
      summary: Guardar el punto de reorden inicial
      description: |
        Roles Dueño. Acepta un entero mayor o igual a 0. Un valor negativo,
        decimal o no numérico responde 422 y conserva el valor anterior. Un
        Empleado recibe 403 y el dato no cambia.
      x-acceptance-criteria:
        - RF-08-AC-1
        - RF-08-AC-2
        - RF-01-AC-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntoReordenInicial'
      responses:
        '200':
          description: Punto de reorden inicial guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoReorden'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: El punto de reorden no es un entero mayor o igual a 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: El punto de reorden debe ser un número entero mayor o igual a 0
                codigo: PUNTO_REORDEN_INVALIDO
                detalles:
                  - campo: prInicial
                    mensaje: El punto de reorden debe ser un número entero mayor o igual a 0
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos/{productoId}/punto-reorden-manual:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    put:
      tags: [Productos]
      operationId: fijarPuntoReordenManual
      summary: Fijar un punto de reorden manual con vigencia
      description: |
        Roles Dueño. El valor manual tiene prioridad sobre el calculado mientras
        la fecha de vigencia sea hoy o una fecha futura, en America/Mexico_City.
        Un manual de 30 vigente hasta el 03/11/2026 se conserva el 03/11/2026;
        desde el 04/11/2026 el cálculo usa el valor calculado.
      x-acceptance-criteria:
        - RF-08-AC-5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PuntoReordenManual'
            example:
              prManual: 30
              vigencia: '2026-11-03'
      responses:
        '200':
          description: Punto de reorden manual vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoReorden'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Valor o vigencia inválidos. Se conserva el punto de reorden anterior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: El punto de reorden debe ser un número entero mayor o igual a 0
                codigo: PUNTO_REORDEN_INVALIDO
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Productos]
      operationId: quitarPuntoReordenManual
      summary: Quitar el punto de reorden manual antes de su vigencia
      description: |
        Roles Dueño. Elimina la prioridad manual. El siguiente cálculo ya puede
        aplicar el valor calculado, o el inicial si el historial no alcanza.
      x-acceptance-criteria:
        - RF-08-AC-5
      responses:
        '200':
          description: Prioridad manual retirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoReorden'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
