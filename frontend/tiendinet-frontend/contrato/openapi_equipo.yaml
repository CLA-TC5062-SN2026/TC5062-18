        disponible, reembolsa la diferencia y también vuelve a "En preparación".
        Si el sustituto ya no tiene disponible, responde 422 con "El sustituto ya
        no está disponible". Si el subtotal de un pedido con envío baja del mínimo,
        se conserva el costo de envío y no se reembolsa. Si todos los renglones
        quedan reembolsados, el pedido pasa a "Cancelado".
      x-acceptance-criteria:
