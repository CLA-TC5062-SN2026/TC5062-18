            Instante que la tarea toma como ahora. Se interpreta en UTC.
            Si se omite, se usa el reloj del sistema. Sirve para verificar
            criterios con una fecha fija, por ejemplo el cálculo del 27/09/2026
            o las 20:00 del día siguiente a "Listo para recoger".
