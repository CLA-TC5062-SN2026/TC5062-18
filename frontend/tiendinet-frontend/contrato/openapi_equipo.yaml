        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /pedidos/{pedidoId}/transiciones:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    post:
      tags: [Pedidos]
      operationId: transicionarPedido
      summary: Avanzar el estado del pedido
      description: |
        Roles Dueño y Empleado. Transiciones aceptadas, sin saltos:

        - PAGADO → EN_PREPARACION, solo si ya hay empleado asignado o el cuerpo trae `empleadoId`. Si no, 409 con "Asigna un empleado al pedido".
        - EN_PREPARACION → LISTO_PARA_RECOGER si la modalidad es recoger.
        - EN_PREPARACION → LISTO_PARA_ENVIAR si la modalidad es envío.
        - LISTO_PARA_ENVIAR → EN_CAMINO.
        - LISTO_PARA_RECOGER → ENTREGADO.
        - EN_CAMINO → ENTREGADO.
        - NO_RECOGIDO → ENTREGADO, si el cliente llega y todavía hay disponible.

        Pasar un pedido de recolección a "En camino" responde 409 con "Estado no
        válido para esta modalidad". Saltar de "Pagado" a "Entregado" responde
        409. Desde "Entregado", cualquier destino responde 409 con "Transición de
        estado no permitida". Al entregar, la existencia física se descuenta con
        FEFO, el apartado de ese pedido queda en 0 y la salida cuenta como venta
        en línea. Cada cambio queda en el historial. La cancelación no se hace
        aquí.
      x-acceptance-criteria:
        - RF-24-AC-1
        - RF-24-AC-2
        - RF-24-AC-3
        - RF-24-AC-4
        - RF-24-AC-5
        - RF-24-AC-6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransicionPedido'
      responses:
        '200':
          description: Estado actualizado y anotado en el historial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Transición inválida, modalidad incompatible o empleado sin asignar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinEmpleado:
                  value:
                    mensaje: Asigna un empleado al pedido
                    codigo: SIN_EMPLEADO
                modalidad:
                  value:
                    mensaje: Estado no válido para esta modalidad
                    codigo: ESTADO_NO_VALIDO
                salto:
                  value:
                    mensaje: Transición de estado no permitida
                    codigo: TRANSICION_NO_PERMITIDA
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
