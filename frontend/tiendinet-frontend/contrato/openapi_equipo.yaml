        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El pedido no está pagado, o el usuario asignado no es un empleado activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
