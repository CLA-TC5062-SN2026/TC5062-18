          type: integer
          minimum: 1
    DecisionFaltante:
      type: object
      additionalProperties: false
      required: [accion]
      properties:
        accion:
          type: string
          enum: [REEMBOLSO, SUSTITUTO]
        productoSustitutoId:
          type: string
          format: uuid
          nullable: true
          description: Obligatorio si la acción es SUSTITUTO. Su precio no puede ser mayor.
    ResolucionNoRecogido:
      type: object
      additionalProperties: false
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [TOTAL, PARCIAL, NINGUNO]
        monto:
          type: string
          nullable: true
          description: Obligatorio si el tipo es PARCIAL. Debe ser mayor que 0 y menor o igual a lo pagado.
          pattern: '^\d+\.\d{2}$'
    WebhookPago:
      type: object
      description: |
        Notificación de Mercado Pago tal como llega. Conserva los nombres en
        inglés porque el formato lo define el servicio externo. Solo trae el
        tipo de evento y el id del recurso; monto, estado y folio se obtienen
        consultando el pago en ServicioPagos. Se aceptan campos adicionales.
      required: [type, data]
      properties:
        id:
          type: string
          description: Id de la notificación.
        type:
          type: string
          description: Tipo de evento. Solo `payment` modifica pedidos o reembolsos.
          example: payment
        action:
          type: string
          example: payment.updated
        live_mode:
          type: boolean
        date_created:
          type: string
          format: date-time
        api_version:
          type: string
          example: v1
        data:
          type: object
          required: [id]
          properties:
            id:
              type: string
              description: Id del pago en Mercado Pago. Se guarda como referenciaServicio.
      example:
        id: '12345'
        type: payment
        action: payment.updated
        live_mode: false
        date_created: '2026-10-02T17:05:00Z'
        api_version: v1
        data:
          id: '999999999'
    ResultadoWebhook:
      type: object
      additionalProperties: false
      required: [aplicado, resultado]
      properties:
        aplicado:
          type: boolean
        resultado:
          type: string
          enum: [PAGADO, DUPLICADO, RECHAZADO, MONTO_NO_COINCIDE, EXPIRADO_RECUPERADO, EXPIRADO_REEMBOLSADO, REEMBOLSO_CONFIRMADO, REEMBOLSO_FALLIDO, IGNORADO]
        mensaje:
          type: string
          nullable: true
        leyendaEntrega:
          type: string
          nullable: true
    EstadoReembolso:
      type: string
      enum: [SOLICITADO, CONFIRMADO, FALLIDO]
    Reembolso:
      type: object
      additionalProperties: false
      required: [id, pedidoId, monto, motivo, estado, fechaHora]
      properties:
        id:
          type: string
          format: uuid
        pedidoId:
          type: string
          format: uuid
        folioPedido:
          type: string
        monto:
          $ref: '#/components/schemas/Dinero'
        motivo:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoReembolso'
        referenciaServicio:
          type: string
          nullable: true
        fechaHora:
          type: string
