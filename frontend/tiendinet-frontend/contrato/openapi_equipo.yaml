      summary: Calcular el efectivo esperado antes de cerrar el corte
      description: |
        Roles Dueño y Empleado. El efectivo esperado suma las ventas completadas
        en efectivo que aún no están en un corte, sin las canceladas. Las de
        tarjeta se informan aparte. Las ventas en línea no entran.
      x-acceptance-criteria:
