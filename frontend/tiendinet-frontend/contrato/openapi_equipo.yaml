          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorPreferido'
      responses:
        '200':
          description: Proveedor preferido guardado. El precio de venta no cambió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Productos]
      operationId: quitarProveedorPreferido
      summary: Quitar el proveedor preferido
      description: |
        Roles Dueño. Sin preferido, el sistema vuelve a elegir la oferta vigente
