      additionalProperties: false
      required: [pedidoMinimoEnvio, costoEnvio, horarioInicio, horarioFin, horaLimiteMismoDia, codigosPostalesEntrega]
      properties:
        pedidoMinimoEnvio:
          $ref: '#/components/schemas/Dinero'
        costoEnvio:
          $ref: '#/components/schemas/Dinero'
        horarioInicio:
          $ref: '#/components/schemas/Hora'
        horarioFin:
          $ref: '#/components/schemas/Hora'
        horaLimiteMismoDia:
          $ref: '#/components/schemas/Hora'
        codigosPostalesEntrega:
          type: array
          items:
            type: string
    ConteoImporte:
      type: object
      additionalProperties: false
      required: [numero, importe]
      properties:
        numero:
          type: integer
        importe:
          $ref: '#/components/schemas/Dinero'
    ReporteDiario:
      type: object
      additionalProperties: false
      required: [fecha, mostrador, enLinea, cancelaciones, totalNeto]
      properties:
        fecha:
          type: string
          format: date
        mostrador:
          $ref: '#/components/schemas/ConteoImporte'
        enLinea:
          $ref: '#/components/schemas/ConteoImporte'
        cancelaciones:
          type: object
          additionalProperties: false
          required: [numero, importeBruto]
          properties:
            numero:
              type: integer
