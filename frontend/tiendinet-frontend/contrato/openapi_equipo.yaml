openapi: 3.0.3
info:
  title: API TiendiNet
  version: 2.0.0
  description: |
    Contrato REST consolidado del equipo TiendiNet (MVP, SRS 2.0). Se armó
    con los contratos de Adrián, Ángel, Víctor y José. El registro de consensos,
    huecos, conflictos y la opción que se conservó está en
    `diferencias_openapi.md`.

    Lo consumen el Portal Tienda y el Portal Clientes. Una sola tienda. La base
    concentradora guarda productos, lotes, ventas, pedidos, ofertas y auditoría.

    ## Seguridad

    Las operaciones protegidas exigen `Authorization: Bearer <JWT>`. El token
    incluye `sub` (id del usuario), `rol` (`DUENO`, `EMPLEADO` o `CLIENTE`) y
    `correo`. Caduca a los 60 minutos para Dueño y Empleado y a las 24 horas
    para el Cliente (RNF-04). En cada petición se comprueba que la cuenta siga
    activa: si el Dueño la desactivó, la respuesta es 401 aunque el JWT no haya
    expirado (RF-03-AC-2).

    El catálogo en línea es público. El webhook de pagos no usa JWT: recibe la
    notificación de Mercado Pago tal como la envía, verifica su firma
    `x-signature` (RF-23-AC-5) y después consulta el pago en `ServicioPagos`
    para obtener monto, estado y folio. TiendiNet no recibe ni guarda datos de
    tarjeta.

    ## Convenciones

    - Importes en MXN con IVA incluido, exactamente dos decimales, como cadena
      (`"38.50"`). El redondeo es aritmético al centavo (RD-07).
    - Los `date-time` se guardan y se devuelven en UTC. Las fechas de negocio
      (corte, reporte, venta diferida, caducidad) se interpretan en
      `America/Mexico_City`. "N días" son días calendario.
    - Existencia disponible = existencia física − apartado − unidades de lotes
      ya caducados. Un lote que caduca hoy sí se puede vender. Las salidas usan
      FEFO entre lotes no caducados (RD-10).
    - Confirmar una venta, crear un pedido, cancelar y procesar un webhook
      ocurren en una sola transacción con bloqueo por fila sobre la existencia.
      Nunca queda existencia negativa (RNF-06).
    - No hay borrado físico de ventas, pedidos, movimientos ni auditoría
      (RNF-14). Cancelar cambia el estado y reintegra inventario una sola vez
      (RD-09).
    - Los POST que cobran o mueven existencia (confirmar venta, venta diferida,
      recepción, ajuste, corte, crear pedido e iniciar pago) exigen el
      encabezado `Idempotency-Key`. Un reintento con la misma clave y el mismo
      cuerpo dentro de 24 horas devuelve la respuesta original con
      `Idempotency-Replayed: true` y no repite la operación. La misma clave con
      otro cuerpo responde 409 `IDEMPOTENCIA_CONFLICTO`. Sin el encabezado,
      responde 422. Protege contra el cobro doble cuando se pierde la respuesta
      por internet intermitente.
    - 400: el cuerpo no es JSON o un tipo es incompatible.
    - 401: credenciales, token o firma inválidos, o cuenta inactiva.
    - 403: el rol no puede ejecutar la operación. También la recibe un Cliente
      que llama un endpoint del Portal Tienda (RF-01-AC-4) y un Empleado que
      pide costos u ofertas o intenta cambiar un precio o un punto de reorden
      (RF-01-AC-3).
    - 404: el recurso no existe. El pedido de otro cliente también responde 404
      (RF-26-AC-4).
    - 409: conflicto de unicidad, de estado o de existencia, o una clave de
      idempotencia reutilizada con otro cuerpo.
    - 422: el JSON es válido pero incumple una regla de campo o de negocio. Los
      criterios del SRS que hablan de un dato inválido esperan este código, e
      indican el campo.
    - 429: solo el inicio de sesión, tras 5 fallos consecutivos de la misma
      combinación correo + IP dentro de 15 minutos (RF-01-AC-5).
    - 500: fallo no previsto, sin detalle interno.

    ## Trazabilidad

    Cada operación declara `x-acceptance-criteria` con los id `RF-XX-AC-Y` que
    satisface. Los 131 criterios de RF-01 a RF-29 están cubiertos. RF-30 es
    Fase 2, no tiene criterios y no tiene endpoint; en el MVP esa necesidad se
    cubre con las ventas diferidas (RF-19).

    La configuración se cambia por campo. Los códigos postales no viajan en
    ese cuerpo: se agregan o se desactivan en su propio recurso, para no
    borrar la zona de entrega al cambiar el costo de envío. Las tareas del
    reloj aceptan `fechaReferencia` opcional. Si viene, ese instante es el
    "ahora" de la tarea; si no, se usa el reloj del sistema. Así se pueden
    verificar los criterios que fijan una fecha.

    ## Recursos

    Autenticación, clientes y usuarios; productos; inventario (recepciones,
    ajustes, lotes, caducidades y alertas); proveedores, ofertas y propuestas
    de compra; punto de venta (búsqueda, ventas, comprobantes y cortes);
    catálogo, carrito y pedidos; pagos y reembolsos; configuración, códigos
    postales, reportes y tareas del reloj.
  contact:
    name: Equipo TiendiNet
    email: equipo@tiendinet.local
  x-srs-version: "2.0"
  x-consolidated-from:
    - Adrián Alberto Cortés Alvarez
    - Ángel Vega Martínez
    - Víctor Manuel Jurado Herrera
    - José
servers:
  - url: http://localhost:8000
    description: Backend local (FastAPI, Docker Compose)
  - url: https://tiendinet.example.com
    description: Túnel HTTPS para los portales y los webhooks de Mercado Pago
tags:
  - name: Autenticación
    description: Inicio de sesión, sesión vigente y recuperación de contraseña.
  - name: Clientes
    description: Registro de la cuenta con rol Cliente.
  - name: Usuarios
    description: Cuentas Dueño y Empleado del Portal Tienda.
  - name: Productos
    description: Ficha única del catálogo, usada por el POS y la tienda en línea.
  - name: Inventario
    description: Recepciones por lote, ajustes, caducidades y alertas de reorden.
  - name: Proveedores
    description: Proveedores simulados, sincronización y productos por vincular.
  - name: Ofertas
    description: Ofertas manuales o sincronizadas, comparación y sugerencia.
  - name: Compras
    description: Propuesta de orden de compra. No se envía al proveedor ni mueve inventario.
  - name: Punto de venta
    description: Búsqueda, venta en curso, confirmación, comprobante, cancelación y venta diferida.
  - name: Cortes de caja
    description: Cierre del efectivo del día. Las ventas en línea no entran al corte.
  - name: Catálogo
    description: Consulta pública de productos vendibles en línea.
  - name: Carrito
    description: Carrito del cliente autenticado, previo al pedido.
  - name: Pedidos
    description: Pedido anticipado, estados, faltantes y seguimiento.
  - name: Pagos
    description: Cobro anticipado vía ServicioPagos y webhook firmado.
  - name: Reembolsos
    description: Reembolsos al medio de pago original y resolución de no recogidos.
  - name: Configuración
    description: Parámetros de la tienda y códigos postales de entrega. Solo el Dueño.
  - name: Reportes
    description: Reporte diario, rotación e indicadores. Solo el Dueño.
  - name: Tareas
    description: |
      Procesos del reloj. Los ejecuta una credencial de servicio con rol Dueño
      y, donde el SRS lo permite, el Dueño bajo demanda. El cuerpo es opcional.
      Con `fechaReferencia` la tarea toma ese instante como ahora.
security:
  - bearerAuth: []
paths:
  /auth/sesiones:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Autentica con correo y contraseña a un usuario activo. El JWT incluye el
        rol y la interfaz muestra solo las funciones de ese rol. Si la contraseña
        es incorrecta o el usuario está inactivo, responde 401 con el mismo
        mensaje, sin indicar cuál falló, y no crea sesión. Cinco intentos fallidos
        consecutivos de la misma combinación correo + IP bloquean el acceso 15
        minutos (429). Un inicio exitoso reinicia el contador.
      security: []
      x-acceptance-criteria:
        - RF-01-AC-1
        - RF-01-AC-2
        - RF-01-AC-5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioSesion'
      responses:
        '200':
          description: Sesión creada. El token incluye el rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                tipo: Bearer
                expiraEn: '2026-10-02T18:00:00Z'
                usuario:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  nombre: Ana Ramírez
                  correo: ana@tiendinet.local
                  rol: DUENO
                  estado: ACTIVO
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: Correo o contraseña incorrectos, o usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Correo o contraseña incorrectos
                codigo: CREDENCIALES_INVALIDAS
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '429':
          description: Cinco intentos fallidos consecutivos de ese correo y esa IP dentro de 15 minutos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLimite'
              example:
                mensaje: Demasiados intentos. Espera 15 minutos.
                codigo: LIMITE_INTENTOS
                reintentaEnSegundos: 900
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /auth/recuperacion-contrasena:
    post:
      tags: [Autenticación]
      operationId: solicitarRecuperacionContrasena
      summary: Solicitar enlace para restablecer la contraseña
      description: |
        Si el correo pertenece a un cliente, envía un enlace de un solo uso
        válido 30 minutos. La respuesta es la misma cuando el correo no existe,
        para no revelar cuentas.
      security: []
      x-acceptance-criteria:
        - RF-02-AC-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecuperacion'
      responses:
        '200':
          description: Solicitud aceptada, sin indicar si el correo existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Si el correo está registrado, enviaremos un enlace para restablecer la contraseña.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /auth/restablecer-contrasena:
    post:
      tags: [Autenticación]
      operationId: restablecerContrasena
      summary: Definir una nueva contraseña con el enlace
      description: |
        El enlace funciona una sola vez y solo durante los 30 minutos siguientes
        a la solicitud. Un segundo uso, o un uso posterior a esos 30 minutos,
        responde 422 con "Enlace inválido o expirado".
      security: []
      x-acceptance-criteria:
        - RF-02-AC-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasena'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Contraseña actualizada.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '422':
          description: Enlace inválido o expirado, o contraseña que no cumple la política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                enlace:
                  value:
                    mensaje: Enlace inválido o expirado
                    codigo: ENLACE_INVALIDO
                politica:
                  value:
                    mensaje: La contraseña debe tener al menos 8 caracteres, con una letra y un número.
                    codigo: CONTRASENA_INVALIDA
                    detalles:
                      - campo: contrasena
                        mensaje: La contraseña debe tener al menos 8 caracteres, con una letra y un número.
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /auth/yo:
    get:
      tags: [Autenticación]
      operationId: obtenerSesionActual
      summary: Consultar el usuario de la sesión
      description: |
        Devuelve el rol para que cada portal muestre solo sus funciones. Si la
        cuenta fue desactivada después de emitir el JWT, responde 401. Esa misma
        comprobación aplica a cualquier otra operación protegida.
      x-acceptance-criteria:
        - RF-01-AC-1
        - RF-03-AC-2
      responses:
        '200':
          description: Usuario de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumen'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /clientes:
    post:
      tags: [Clientes]
      operationId: registrarCliente
      summary: Registrar una cuenta de cliente
      description: |
        Crea una cuenta con rol Cliente. Exige nombre, correo, teléfono de 10
        dígitos, contraseña (8 caracteres o más, con letra y número), dirección
        con código postal y la aceptación del aviso de privacidad. Si el correo
        ya existe, responde 409 y no crea la cuenta.
      security: []
      x-acceptance-criteria:
        - RF-02-AC-1
        - RF-02-AC-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroCliente'
      responses:
        '201':
          description: Cuenta de cliente creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Este correo ya está registrado
                codigo: CORREO_DUPLICADO
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/activacion:
    post:
      tags: [Usuarios]
      operationId: activarUsuario
      summary: Activar una cuenta de la tienda y definir su contraseña
      description: |
        Completa el correo de activación que recibe un Dueño o un Empleado nuevo.
        Al activarse, un Dueño ya puede iniciar sesión, ver costos y cambiar precios.
      security: []
      x-acceptance-criteria:
        - RF-03-AC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivacionUsuario'
      responses:
        '200':
          description: Cuenta activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioTienda'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '422':
          description: Enlace inválido o expirado, o contraseña que no cumple la política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Enlace inválido o expirado
                codigo: ENLACE_INVALIDO
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Listar usuarios de la tienda
      description: Roles Dueño. No incluye clientes ni el hash de la contraseña.
      x-acceptance-criteria:
        - RF-03-AC-1
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoUsuario'
      responses:
        '200':
          description: Página de usuarios de la tienda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUsuarios'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Crear un Dueño o un Empleado
      description: |
        El Dueño captura nombre, correo y rol. La cuenta queda inactiva hasta que
        la persona abre el correo de activación y define su contraseña. Un Dueño
        activado puede ver costos y cambiar precios.
      x-acceptance-criteria:
        - RF-03-AC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Usuario creado y correo de activación enviado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioTienda'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Este correo ya está registrado
                codigo: CORREO_DUPLICADO
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Usuarios]
      operationId: obtenerUsuario
      summary: Consultar un usuario de la tienda
      description: Roles Dueño.
      x-acceptance-criteria:
        - RF-03-AC-1
      responses:
        '200':
          description: Usuario de la tienda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioTienda'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [Usuarios]
      operationId: actualizarEstadoUsuario
      summary: Desactivar o reactivar un usuario de la tienda
      description: |
        Cambia el estado. No se puede desactivar al último Dueño activo. Cuando
        un Empleado desactivado usa un JWT que aún no caduca, cualquier operación
        protegida responde 401.
      x-acceptance-criteria:
        - RF-03-AC-2
        - RF-03-AC-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEstado'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioTienda'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Se intentó desactivar al último Dueño activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: Debe existir al menos un Dueño activo
                codigo: ULTIMO_DUENO
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos:
    get:
      tags: [Productos]
      operationId: listarProductos
      summary: Listar la ficha de productos, con costos
      description: |
        Roles Dueño. Incluye precio, costo de referencia y punto de reorden.
        Un Empleado que llama este endpoint recibe 403, porque la respuesta
        contiene costos. Para cobrar o recibir mercancía usa la búsqueda del POS
        o el listado de inventario, que no traen costos.
      x-acceptance-criteria:
        - RF-04-AC-1
        - RF-01-AC-3
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - $ref: '#/components/parameters/TextoBusqueda'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoProducto'
        - name: categoria
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Página de fichas con costo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaProductos'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Crear la ficha de un producto
      description: |
        Roles Dueño. La ficha nace activa, con existencia física y disponible en
        0, y se puede buscar en el POS. Si no es restringida, también entra al
        catálogo en línea. El código de barras, si se envía, es único. También
        es único el par nombre + presentación, sin distinguir mayúsculas ni
        espacios extremos. Un precio o un costo negativos, o un dato obligatorio
        ausente, responden 422 e indican el campo. No se crea la ficha.
      x-acceptance-criteria:
        - RF-04-AC-1
        - RF-04-AC-2
        - RF-04-AC-3
        - RF-04-AC-4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCrear'
            example:
              codigoBarras: '7501055300075'
              nombre: Aceite vegetal 1 L
              presentacion: 1 L
              categoria: Abarrotes
              precioVenta: '38.50'
              costoReferencia: '31.00'
              prInicial: 10
              perecedero: false
              restringido: false
      responses:
        '201':
          description: Ficha activa con existencia 0.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          description: Código de barras duplicado, o mismo nombre y presentación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                codigo:
                  value:
                    mensaje: Código duplicado
                    codigo: CODIGO_DUPLICADO
                nombre:
                  value:
                    mensaje: Ya existe un producto con el mismo nombre y presentación
                    codigo: FICHA_DUPLICADA
        '422':
          $ref: '#/components/responses/EntidadNoProcesable'
        '500':
