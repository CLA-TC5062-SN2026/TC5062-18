  /pos/productos:
    get:
      tags: [Punto de venta]
      operationId: buscarProductosPos
      summary: Buscar productos activos para el mostrador
      description: |
        Roles Dueño y Empleado. `codigoBarras` busca la coincidencia exacta
        (tecleada o leída por el lector USB). `q` busca por nombre, sin distinguir
        mayúsculas ni acentos. La respuesta trae nombre, precio y existencia
        disponible, sin costo. Si nada coincide, la lista va vacía y el mensaje es
        "Producto no encontrado"; la venta en curso no cambia. Un Cliente recibe 403.
      x-acceptance-criteria:
        - RF-15-AC-1
        - RF-15-AC-2
        - RF-15-AC-3
        - RF-01-AC-4
      parameters:
        - name: q
          in: query
          description: Coincidencia parcial del nombre, sin mayúsculas ni acentos.
          schema:
            type: string
        - name: codigoBarras
          in: query
          description: Código de barras exacto.
          schema:
            type: string
            pattern: '^\d{13}$'
      responses:
        '200':
          description: Coincidencias, o lista vacía con "Producto no encontrado".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusquedaPos'
              examples:
                porNombre:
                  value:
                    mensaje: null
                    productos:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        nombre: Frijol negro 1 kg
                        presentacion: 1 kg
                        precioVenta: '32.00'
                        existenciaDisponible: 14
                sinCoincidencia:
                  value:
                    mensaje: Producto no encontrado
                    productos: []
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: Visitante sin sesión. El portal lo dirige a iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas:
    get:
      tags: [Punto de venta]
      operationId: listarVentas
      summary: Listar ventas de mostrador
      description: |
        Roles Dueño y Empleado. Por defecto no incluye borradores. El responsable,
        la fecha y la hora de una venta confirmada no tienen operación de cambio.
        Con `folio` se localiza la venta impresa; el comprobante se abre después
        con su id.
      x-acceptance-criteria:
        - RF-18-AC-4
        - RF-17-AC-1
        - RF-17-AC-2
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoVenta'
        - name: fecha
          in: query
          description: Día de negocio en America/Mexico_City.
          schema:
            type: string
            format: date
        - name: folio
          in: query
          description: Folio exacto asignado al confirmar. Es el número que queda en el comprobante.
          schema:
            type: string
      responses:
        '200':
          description: Ventas del mostrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaVentas'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Punto de venta]
      operationId: crearVenta
      summary: Abrir una venta en curso
      description: |
        Roles Dueño y Empleado. Crea un borrador sin folio y sin tocar existencias.
        El total empieza en 0.00 y se recalcula al agregar renglones. Un Cliente
        recibe 403.
      x-acceptance-criteria:
        - RF-16-AC-2
        - RF-01-AC-4
        - RF-01-AC-6
      responses:
        '201':
          description: Venta en curso, sin descontar inventario.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas/{ventaId}:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    get:
      tags: [Punto de venta]
      operationId: obtenerVenta
      summary: Consultar una venta
      description: |
        Roles Dueño y Empleado. El usuario responsable, la fecha y la hora quedan
        fijos al confirmar. Esta API no ofrece PUT ni PATCH sobre la venta: no hay
        forma de modificarlos. Los precios del renglón son los guardados en la venta.
      x-acceptance-criteria:
        - RF-18-AC-4
        - RF-17-AC-2
      responses:
        '200':
          description: Venta. Responsable, fecha y hora son inmutables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas/{ventaId}/renglones:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    post:
      tags: [Punto de venta]
      operationId: agregarRenglonVenta
      summary: Agregar un renglón a la venta en curso
      description: |
        Roles Dueño y Empleado. La cantidad debe ser un entero mayor que 0. Cero,
        negativo o decimal responden 422 con "La cantidad debe ser un número entero
        mayor a 0" y el renglón no se agrega. El total se recalcula. La existencia
        no cambia hasta confirmar.
      x-acceptance-criteria:
        - RF-16-AC-2
        - RF-16-AC-7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenglonVentaCrear'
      responses:
        '201':
          description: Venta en curso con el total recalculado. La existencia no cambió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La venta ya no está en curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: La cantidad no es un entero mayor que 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: La cantidad debe ser un número entero mayor a 0
                codigo: CANTIDAD_INVALIDA
                detalles:
                  - campo: cantidad
                    mensaje: La cantidad debe ser un número entero mayor a 0
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas/{ventaId}/renglones/{renglonId}:
    parameters:
      - $ref: '#/components/parameters/VentaId'
      - $ref: '#/components/parameters/RenglonId'
    patch:
      tags: [Punto de venta]
      operationId: modificarRenglonVenta
      summary: Cambiar la cantidad de un renglón
      description: |
        Roles Dueño y Empleado. Recalcula el total. La existencia no cambia hasta
        confirmar. Una cantidad que no sea un entero mayor que 0 responde 422.
      x-acceptance-criteria:
        - RF-16-AC-2
        - RF-16-AC-7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenglonVentaActualizar'
      responses:
        '200':
          description: Total recalculado. La existencia no cambió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La venta ya no está en curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: La cantidad no es un entero mayor que 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                mensaje: La cantidad debe ser un número entero mayor a 0
                codigo: CANTIDAD_INVALIDA
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Punto de venta]
      operationId: eliminarRenglonVenta
      summary: Quitar un renglón de la venta en curso
      description: |
        Roles Dueño y Empleado. Recalcula el total (por ejemplo, de 90.00 a 70.00
        al quitar un renglón de 20.00). La existencia no cambia.
      x-acceptance-criteria:
        - RF-16-AC-2
      responses:
        '200':
          description: Total recalculado. La existencia no cambió.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La venta ya no está en curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas/{ventaId}/confirmaciones:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    post:
      tags: [Punto de venta]
      operationId: confirmarVenta
      summary: Cobrar y confirmar la venta
      description: |
        Roles Dueño y Empleado. En una sola transacción valida el pago, asigna un
        folio único, registra al usuario y descuenta con FEFO. En efectivo exige
        un monto recibido mayor o igual al total y devuelve el cambio; si es menor,
        no confirma, informa el faltante y no toca existencias. Con tarjeta de la
        terminal registra el método y el total, sin monto recibido ni cambio. Si
        un renglón pide más de la disponible (la apartada no se vende), responde
        409, rechaza toda la venta y señala producto, cantidad solicitada y
        disponible. Ante dos confirmaciones concurrentes por la última unidad,
        exactamente una responde 2xx y la otra 409 con "Producto agotado"; ninguna
        existencia queda negativa. Un lote que caduca hoy sí se puede vender. Si
        la disponible queda en o bajo el punto de reorden se genera o actualiza
        una sola alerta; si no cruza ese nivel, no se genera. Un Cliente recibe 403.
      x-acceptance-criteria:
        - RF-16-AC-1
        - RF-16-AC-3
        - RF-16-AC-4
        - RF-16-AC-5
        - RF-16-AC-6
        - RF-07-AC-4
        - RF-09-AC-1
        - RF-09-AC-3
        - RF-09-AC-4
        - RF-01-AC-4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarVenta'
            examples:
              efectivo:
                value:
                  formaPago: EFECTIVO
                  montoRecibido: '100.00'
              tarjeta:
                value:
                  formaPago: TARJETA_TERMINAL
      responses:
        '200':
          description: Venta completada, con folio, cambio y existencias ya descontadas.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                folio: VTA-000128
                estado: COMPLETADA
                diferida: false
                formaPago: EFECTIVO
                total: '77.00'
                montoRecibido: '100.00'
                cambio: '23.00'
                renglones:
                  - id: 11111111-1111-1111-1111-111111111111
                    productoId: 22222222-2222-2222-2222-222222222222
                    nombre: Aceite vegetal 1 L
                    cantidad: 2
                    precioUnitario: '38.50'
                    subtotal: '77.00'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            Existencia insuficiente. No se registra la venta ni se modifica el
            inventario. También responde 409, con código IDEMPOTENCIA_CONFLICTO,
            si la clave Idempotency-Key ya se usó con otro cuerpo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorExistencia'
              example:
                mensaje: Producto agotado
                codigo: SIN_EXISTENCIA
                productoId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                nombreProducto: Aceite vegetal 1 L
                cantidadSolicitada: 1
                disponible: 0
        '422':
          description: El efectivo recibido no cubre el total, o la venta no tiene renglones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFaltantePago'
              example:
                mensaje: El monto recibido no cubre el total
                codigo: PAGO_INSUFICIENTE
                faltante: '2.50'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas/{ventaId}/comprobante:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    get:
      tags: [Punto de venta]
      operationId: obtenerComprobante
      summary: Consultar el comprobante no fiscal
      description: |
        Roles Dueño y Empleado. Muestra folio, fecha y hora, usuario, renglones,
        cantidades, precios unitarios guardados en la venta, total, forma de pago,
        efectivo recibido y cambio. Si el precio cambió después, no se recalcula.
        Si la venta fue cancelada, lleva la marca "Cancelada", el motivo, quién
        canceló y cuándo. Quien solo tiene el folio impreso lo busca en
        `GET /ventas?folio=` y abre este recurso con el id resultante. El borrador
        aún no tiene folio ni comprobante.
      x-acceptance-criteria:
        - RF-17-AC-1
        - RF-17-AC-2
        - RF-17-AC-3
      responses:
        '200':
          description: Comprobante de esa venta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comprobante'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: La venta no existe o sigue en borrador y aún no tiene comprobante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas/{ventaId}/cancelaciones:
    parameters:
      - $ref: '#/components/parameters/VentaId'
    post:
      tags: [Punto de venta]
      operationId: cancelarVenta
      summary: Cancelar una venta completada
      description: |
        Roles Dueño y Empleado. Exige motivo. La venta permanece en el historial,
        pasa a "Cancelada" y las unidades regresan, una sola vez, a los lotes de
        los que salieron. Se conserva al responsable original y se registra quién
        canceló, el motivo, la fecha y la hora. Una segunda cancelación responde
        409 y no vuelve a incrementar existencias. Si la venta ya está en un corte
        cerrado, responde 409 con "La venta pertenece a un corte cerrado". Si al
        reintegrar la disponible supera el punto de reorden, la alerta pasa a resuelta.
      x-acceptance-criteria:
        - RF-18-AC-1
        - RF-18-AC-2
        - RF-18-AC-3
        - RF-09-AC-5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarVenta'
      responses:
        '200':
          description: Venta cancelada y unidades reintegradas una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya estaba cancelada, o pertenece a un corte cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                repetida:
                  value:
                    mensaje: La venta ya está cancelada
                    codigo: VENTA_YA_CANCELADA
                corte:
                  value:
                    mensaje: La venta pertenece a un corte cerrado
                    codigo: CORTE_CERRADO
        '422':
          description: Falta el motivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /ventas-diferidas:
    post:
      tags: [Punto de venta]
      operationId: capturarVentaDiferida
      summary: Capturar una venta hecha sin conexión
      description: |
        Roles Dueño y Empleado. La fecha y hora reales no pueden ser futuras ni
        tener más de 3 días; si no, responde 422 con "Solo se pueden capturar
        ventas de los últimos 3 días". La venta queda completada y marcada como
        diferida, descuenta existencia y cuenta para el consumo diario promedio y
        para el reporte de ese día. Si la cantidad excede la disponible, se
        registra completa, se descuentan solo las unidades disponibles, no se toca
        el apartado, el producto queda con marca "Descuadre" y se avisa al Dueño
        para hacer un conteo. Un lote que caduca hoy sí se descuenta.
      x-acceptance-criteria:
        - RF-19-AC-1
        - RF-19-AC-2
        - RF-19-AC-3
        - RF-07-AC-4
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VentaDiferidaCrear'
      responses:
        '201':
          description: Venta diferida registrada. Puede incluir productos en descuadre.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoIdempotencia'
        '422':
