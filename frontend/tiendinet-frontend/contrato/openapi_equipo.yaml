      required: [ejecutadaEn, pedidosRevisados, reembolsosRevisados]
      properties:
        ejecutadaEn:
          type: string
          format: date-time
        pedidosRevisados:
          type: integer
        pedidosActualizados:
          type: integer
        reembolsosRevisados:
          type: integer
        reembolsosActualizados:
          type: integer
