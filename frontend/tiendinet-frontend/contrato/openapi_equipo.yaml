        mensaje:
          type: string
          nullable: true
    ProductoCalculadoPR:
      type: object
      additionalProperties: false
      required: [productoId, prVigente, origenPR, diasHistorial, diasSeguridad]
      properties:
        productoId:
          type: string
          format: uuid
        prAnterior:
          type: integer
