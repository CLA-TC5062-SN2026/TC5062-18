    put:
      tags: [Productos]
      operationId: asignarProveedorPreferido
      summary: Asignar el proveedor preferido del producto
      description: |
        Roles Dueño. La elección se guarda. El siguiente cálculo del punto de
        reorden usa los días de entrega de ese proveedor. El precio de venta no
