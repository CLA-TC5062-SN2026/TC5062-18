# ==========================================================================
# TiendiNet - Contrato OpenAPI 3.0 (spec-first)  |  S04-A2
# Fuente: SRS_equipo.md v2.0, diagrama de clases y componentes (S04-A1)
# x-acceptance-criteria: criterios RF-XX-AC-Y que satisface cada operación
# x-roles: roles autorizados (PUBLICO = sin sesión; MERCADO_PAGO = firma)
# Correcciones respecto al borrador del agente: ver revision_rest.md
# ==========================================================================
openapi: 3.0.3
info:
  title: TiendiNet API
  version: 1.0.0
  description: 'Contrato REST del MVP de TiendiNet (spec-first). Fuente de verdad para el backend FastAPI (S05-S06)
    y las pruebas automatizadas (S09).


    **Convenciones**

    - Recursos en español, plural, minúsculas y kebab-case; sin verbos en las rutas.

    - Cada operación declara `x-acceptance-criteria` (IDs `RF-XX-AC-Y` del SRS v2.0) y `x-roles` (matriz de permisos
    SRS §3.4).

    - Errores en `application/problem+json` (RFC 7807) con un `codigo` estable; `detail` lleva el mensaje del SRS.

    - 400 = JSON mal formado; 422 = regla de negocio o validación; 409 = choca con el estado actual (existencias,
    transiciones, duplicados).

    - Colecciones paginadas con `page` y `pageSize` y respuesta `{datos, paginacion}`.

    - Las operaciones no idempotentes críticas exigen el encabezado `Idempotency-Key`.

    - Fechas y horas en ISO 8601 UTC; la lógica de negocio usa America/Mexico_City.

    - Importes en MXN con IVA y 2 decimales.'
  contact:
    name: Equipo TiendiNet
  license:
    name: Uso académico
    url: https://creativecommons.org/licenses/by-nc/4.0/
servers:
- url: http://localhost:8000/api/v1
  description: Docker Compose local
- url: https://{dominio}/api/v1
  description: Piloto expuesto por túnel HTTPS
  variables:
    dominio:
      default: tiendinet.trycloudflare.com
security:
- bearerAuth: []
tags:
- name: Autenticación
  description: Sesión, registro de clientes y recuperación de contraseña (RF-01, RF-02)
- name: Usuarios
  description: Cuentas de la tienda (RF-03)
- name: Productos
  description: Catálogo interno y categorías (RF-04, RF-15)
- name: Inventario
  description: Lotes, recepciones, ajustes, caducidades, PR y alertas (RF-05 a RF-09)
- name: Proveedores
  description: Sincronización, ofertas, comparación, sugerencia y propuesta (RF-10 a RF-14)
- name: Ventas
  description: Punto de venta, comprobante, cancelación, diferidas y corte (RF-16 a RF-20)
- name: Tienda en línea
  description: Catálogo público y carrito (RF-21, RF-22)
- name: Pedidos
  description: Pedidos anticipados, estados y faltantes (RF-22, RF-24 a RF-26)
- name: Pagos
  description: Pagos, webhook de Mercado Pago y reembolsos (RF-23, RF-27)
- name: Administración
  description: Configuración y procesos programados (RF-28)
- name: Reportes
  description: Reportes e indicadores (RF-29)
paths:
  /sesiones:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión con correo y contraseña
      operationId: iniciarSesion
      description: Emite un JWT con el rol del usuario (60 min tienda, 24 h cliente; RNF-04). Responde 200 y no
        201 porque el token no es un recurso consultable por URI. Tras 5 fallos consecutivos de la combinación correo
        + IP responde 429 durante 15 min.
      security: []
      x-roles:
      - PUBLICO
      x-acceptance-criteria:
      - RF-01-AC-1
      - RF-01-AC-2
      - RF-01-AC-5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionCrear'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/CredencialesInvalidas'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /clientes:
    post:
      tags:
      - Autenticación
      summary: Registrar una cuenta de cliente
      operationId: registrarCliente
      description: Registrar una cuenta de cliente.
      security: []
      x-roles:
      - PUBLICO
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-02-AC-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCrear'
      responses:
        '201':
          description: Cuenta creada con rol CLIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /solicitudes-recuperacion:
    post:
      tags:
      - Autenticación
      summary: Solicitar enlace para recuperar la contraseña
      operationId: solicitarRecuperacion
      description: Siempre responde 202, exista o no el correo, para no revelar cuentas registradas. El enlace vence
        a los 30 minutos y es de un solo uso.
      security: []
      x-roles:
      - PUBLICO
      x-acceptance-criteria:
      - RF-02-AC-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecuperacion'
      responses:
        '202':
          description: Solicitud aceptada; si el correo existe, se envía el enlace
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /restablecimientos-contrasena:
    post:
      tags:
      - Autenticación
      summary: Definir contraseña con el token de un enlace (recuperación o activación)
      operationId: restablecerContrasena
      description: Consume el token de un solo uso enviado por correo. Sirve también para activar cuentas de la
        tienda creadas por el Dueño (RF-03-AC-1).
      security: []
      x-roles:
      - PUBLICO
      x-acceptance-criteria:
      - RF-02-AC-3
      - RF-03-AC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecimientoContrasena'
      responses:
        '204':
          description: Contraseña definida
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '410':
          $ref: '#/components/responses/EnlaceExpirado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/me:
    get:
      tags:
      - Usuarios
      summary: Consultar el usuario autenticado
      operationId: consultarUsuarioActual
      description: Consultar el usuario autenticado.
      x-roles:
      - DUENO
      - EMPLEADO
      - CLIENTE
      x-acceptance-criteria:
      - RF-01-AC-1
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios:
    get:
      tags:
      - Usuarios
      summary: Listar usuarios de la tienda
      operationId: listarUsuarios
      description: Listar usuarios de la tienda.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-03-AC-1
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanoPagina'
      - name: rol
        in: query
        schema:
          $ref: '#/components/schemas/Rol'
      - name: activo
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
      - Usuarios
      summary: Crear cuenta de Dueño o Empleado
      operationId: crearUsuario
      description: La cuenta nace activa sin contraseña; se envía un correo de activación que se consume en POST
        /restablecimientos-contrasena.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-03-AC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{usuarioId}:
    get:
      tags:
      - Usuarios
      summary: Consultar un usuario
      operationId: consultarUsuario
      description: Consultar un usuario.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-03-AC-1
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags:
      - Usuarios
      summary: Cambiar nombre, rol o estado (activar/desactivar) de un usuario
      operationId: actualizarUsuario
      description: 'Desactivar invalida de inmediato los JWT vigentes: la API valida en cada petición que la cuenta
        siga activa y responde 401 (RF-03-AC-2, RNF-04). Siempre debe quedar al menos un Dueño activo (409).'
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-03-AC-2
      - RF-03-AC-3
      parameters:
      - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /categorias:
    get:
      tags:
      - Productos
      summary: Listar categorías
      operationId: listarCategorias
      description: Listar categorías.
      security: []
      x-roles:
      - PUBLICO
      x-acceptance-criteria:
      - RF-21-AC-1
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
      - Productos
      summary: Crear categoría
      operationId: crearCategoria
      description: Crear categoría.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-04-AC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaCrear'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos:
    get:
      tags:
      - Productos
      summary: Buscar y listar productos (POS y administración)
      operationId: listarProductos
      description: 'Búsqueda del POS por coincidencia parcial de nombre sin distinguir mayúsculas ni acentos (`q`)
        o por código de barras exacto (`codigoBarras`). Sin coincidencias responde 200 con `datos` vacío; la interfaz
        muestra "Producto no encontrado". Nunca incluye costos (RD-06): esos están en /productos/{productoId}/costo.'
      x-roles:
      - DUENO
      - EMPLEADO
      x-acceptance-criteria:
      - RF-15-AC-1
      - RF-15-AC-2
      - RF-15-AC-3
      - RF-04-AC-1
      - RF-04-AC-5
      parameters:
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/TamanoPagina'
      - name: q
        in: query
        schema:
          type: string
          minLength: 2
      - name: codigoBarras
        in: query
        schema:
          type: string
          pattern: ^[0-9]{8,14}$
      - name: categoriaId
        in: query
        schema:
          type: integer
      - name: activo
        in: query
        schema:
          type: boolean
          default: true
      - name: bajoPuntoReorden
        in: query
        schema:
          type: boolean
        description: Solo productos con disponible ≤ PR.
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProducto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags:
      - Productos
      summary: Dar de alta un producto
      operationId: crearProducto
      description: Dar de alta un producto.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-04-AC-2
      - RF-04-AC-3
      - RF-04-AC-4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCrear'
      responses:
        '201':
          description: Producto activo con existencia 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos/{productoId}:
    get:
      tags:
      - Productos
      summary: Consultar un producto
      operationId: consultarProducto
      description: Consultar un producto.
      x-roles:
      - DUENO
      - EMPLEADO
      x-acceptance-criteria:
      - RF-04-AC-5
      parameters:
      - $ref: '#/components/parameters/ProductoId'
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags:
      - Productos
      summary: Editar datos, precio, proveedor preferido o desactivar un producto
      operationId: actualizarProducto
      description: 'Actualización parcial (JSON merge). `activo: false` desactiva el producto: deja de aparecer
        en el POS y el catálogo, y su historial se conserva. No existe DELETE porque un producto con ventas no se
        borra (RNF-14). Cambiar el proveedor preferido no altera el precio de venta.'
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-04-AC-4
      - RF-04-AC-5
      - RF-13-AC-4
      - RF-01-AC-3
      parameters:
      - $ref: '#/components/parameters/ProductoId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProductoActualizar'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos/{productoId}/costo:
    get:
      tags:
      - Productos
      summary: Consultar costo de referencia, último costo de lote y margen
      operationId: consultarCostoProducto
      description: Consultar costo de referencia, último costo de lote y margen.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-01-AC-3
      parameters:
      - $ref: '#/components/parameters/ProductoId'
      responses:
        '200':
          description: Costos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostoProducto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos/{productoId}/lotes:
    get:
      tags:
      - Inventario
      summary: Lotes del producto con cantidad y caducidad
      operationId: listarLotesProducto
      description: Lotes del producto con cantidad y caducidad.
      x-roles:
      - DUENO
      - EMPLEADO
      x-acceptance-criteria:
      - RF-07-AC-1
      parameters:
      - $ref: '#/components/parameters/ProductoId'
      - name: incluirAgotados
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Lotes ordenados por caducidad (FEFO)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lote'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /productos/{productoId}/punto-reorden:
    get:
      tags:
      - Inventario
      summary: Detalle del punto de reorden y su origen
      operationId: consultarPuntoReorden
      description: Detalle del punto de reorden y su origen.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-08-AC-3
      - RF-08-AC-4
      - RF-08-AC-6
      - RF-08-AC-7
      parameters:
      - $ref: '#/components/parameters/ProductoId'
      responses:
        '200':
          description: Detalle del PR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoReorden'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags:
      - Inventario
      summary: Fijar PR inicial o PR manual con vigencia
      operationId: actualizarPuntoReorden
      description: Fijar PR inicial o PR manual con vigencia.
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-08-AC-1
      - RF-08-AC-2
      - RF-08-AC-5
      - RF-01-AC-3
      parameters:
      - $ref: '#/components/parameters/ProductoId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PuntoReordenActualizar'
      responses:
        '200':
          description: PR guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoReorden'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /recepciones:
    post:
      tags:
      - Inventario
      summary: Registrar mercancía recibida (crea un lote)
      operationId: registrarRecepcion
      description: Si quien registra es Empleado, `costoUnitario` se ignora (RF-05-AC-3) y se toma el de la oferta
        vigente; los proveedores de ruta pueden quedar sin costo. Resuelve la alerta de reorden si la disponible
        supera el PR.
      x-roles:
      - DUENO
      - EMPLEADO
      x-acceptance-criteria:
      - RF-05-AC-1
      - RF-05-AC-2
      - RF-05-AC-3
      - RF-05-AC-4
      - RF-09-AC-5
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecepcionCrear'
      responses:
        '201':
