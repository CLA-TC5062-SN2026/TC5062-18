  /procesos/{proceso}/ejecuciones:
    post:
      tags:
      - Administración
      summary: Ejecutar bajo demanda un proceso programado del worker
      operationId: ejecutarProceso
      description: 'Ejecuta el mismo servicio que dispara el reloj, con advisory lock (409 si ya corre). `fechaReferencia`
        simula la fecha del proceso y solo se acepta fuera de producción (pruebas S09). Procesos: CADUCIDADES (7:00),
        PUNTO_REORDEN (6:00), EXPIRACION_PEDIDOS (cada minuto: 15 min sin pago y 24 h expirado), CONCILIACION_PAGOS
        (cada 10 min), NO_RECOGIDOS (20:00), FALTANTES_VENCIDOS (cada minuto).'
      x-roles:
      - DUENO
      x-acceptance-criteria:
      - RF-07-AC-2
      - RF-07-AC-3
      - RF-08-AC-3
      - RF-08-AC-4
