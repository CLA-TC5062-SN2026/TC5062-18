      summary: Notificación de pago o reembolso de Mercado Pago
      operationId: recibirNotificacionMercadoPago
      description: 'Autenticado por firma HMAC (`x-signature`), no por JWT. Idempotente: el id de la notificación
        se registra y un duplicado responde 200 sin cambios ni segundo correo. El backend consulta el pago en la
        API de MP antes de actuar. Pago aprobado por monto exacto → PAGADO; pedido EXPIRADO → se vuelve a apartar
        o se reembolsa; monto distinto → alerta al Dueño; rechazo → el pedido sigue PENDIENTE_DE_PAGO.'
