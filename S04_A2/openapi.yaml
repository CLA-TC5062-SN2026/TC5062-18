      responses:
        '200':
          description: Ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ejecucion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT con claims `sub` (id de usuario) y `rol`. La API verifica en cada petición que la cuenta
        siga activa.
    firmaMercadoPago:
      type: apiKey
      in: header
      name: x-signature
      description: Firma HMAC-SHA256 de Mercado Pago (ts + v1) calculada con el secreto del webhook; se valida junto
        con x-request-id.
  headers:
    Location:
      description: URI del recurso creado
      schema:
        type: string
        format: uri-reference
  parameters:
    Pagina:
      name: page
      in: query
      description: Número de página (desde 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    TamanoPagina:
      name: pageSize
      in: query
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Desde:
      name: desde
      in: query
      schema:
        type: string
        format: date
    Hasta:
      name: hasta
      in: query
      schema:
        type: string
        format: date
    DesdeRequerido:
      name: desde
      in: query
      required: true
      schema:
        type: string
        format: date
    HastaRequerido:
      name: hasta
      in: query
      required: true
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el portal. Repetir la misma clave con el mismo cuerpo devuelve la respuesta
        original sin repetir la operación (24 h). La misma clave con otro cuerpo responde 422.
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LoteId:
      name: loteId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SincronizacionId:
      name: sincronizacionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProductoPorVincularId:
      name: productoPorVincularId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OfertaId:
      name: ofertaId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PropuestaId:
      name: propuestaId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Folio:
      name: folio
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Folio único e incremental
    CorteId:
      name: corteId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RenglonId:
      name: renglonId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReembolsoId:
      name: reembolsoId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EjecucionId:
      name: ejecucionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Proceso:
      name: proceso
      in: path
      required: true
      schema:
        type: string
        enum:
        - CADUCIDADES
        - PUNTO_REORDEN
        - EXPIRACION_PEDIDOS
        - CONCILIACION_PAGOS
        - NO_RECOGIDOS
        - FALTANTES_VENCIDOS
      description: Proceso programado del worker
  responses:
    SolicitudMalFormada:
      description: El cuerpo no es JSON válido o no corresponde al tipo de contenido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/solicitud-mal-formada
            title: Solicitud mal formada
            status: 400
            codigo: SOLICITUD_MAL_FORMADA
    NoAutenticado:
      description: Falta el JWT, expiró o la cuenta está inactiva
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/no-autenticado
            title: No autenticado
            status: 401
            codigo: NO_AUTENTICADO
    CredencialesInvalidas:
      description: Credenciales incorrectas o usuario inactivo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/credenciales
            title: Credenciales inválidas
            status: 401
            detail: Correo o contraseña incorrectos
            codigo: CREDENCIALES_INVALIDAS
    FirmaInvalida:
      description: La firma x-signature no corresponde
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/firma-invalida
            title: Firma inválida
            status: 401
            codigo: FIRMA_INVALIDA
    SinPermiso:
      description: El rol no tiene permiso para esta operación (matriz SRS §3.4)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/sin-permiso
            title: Sin permiso
            status: 403
            codigo: SIN_PERMISO
    NoEncontrado:
      description: El recurso no existe o no pertenece al usuario
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/no-encontrado
            title: No encontrado
            status: 404
            codigo: NO_ENCONTRADO
    EnlaceExpirado:
      description: El enlace ya se usó o venció
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/enlace-expirado
            title: Enlace expirado
            status: 410
            detail: Enlace inválido o expirado
            codigo: ENLACE_EXPIRADO
    Conflicto:
      description: La operación choca con el estado actual del recurso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/conflicto
            title: Conflicto
            status: 409
            detail: Transición de estado no permitida
            codigo: TRANSICION_NO_PERMITIDA
    ProductoAgotado:
      description: Uno o más productos no tienen disponible suficiente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/producto-agotado
            title: Producto agotado
            status: 409
            detail: Producto agotado
            codigo: PRODUCTO_AGOTADO
            productosAgotados:
            - productoId: 12
              nombre: Aceite vegetal 1 L
              solicitada: 2
              disponible: 0
    ErrorValidacion:
      description: Datos válidos en formato pero que incumplen una regla del dominio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/validacion
            title: Datos inválidos
            status: 422
            detail: La fecha de caducidad es obligatoria para productos perecederos
            codigo: VALIDACION
            errores:
            - campo: fechaCaducidad
              mensaje: Obligatoria
    DemasiadosIntentos:
      description: 5 intentos fallidos consecutivos de correo + IP; reintentar después de 15 min
      headers:
        Retry-After:
          description: Segundos para reintentar
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/demasiados-intentos
            title: Demasiados intentos
            status: 429
            codigo: DEMASIADOS_INTENTOS
    ErrorInterno:
      description: Error no previsto del servidor; se registra con un id de correlación
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://tiendinet.mx/problemas/error-interno
            title: Error interno
            status: 500
            codigo: ERROR_INTERNO
  schemas:
    Problema:
      type: object
      description: Problem Details (RFC 7807).
      required:
      - type
      - title
      - status
      - codigo
      properties:
        type:
          type: string
          format: uri
          example: https://tiendinet.mx/problemas/producto-agotado
        title:
